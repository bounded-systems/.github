name: site-deploy

# Canonical, reusable site-deploy pipeline for bounded-systems sites.
#
# A calling repo builds + keyless-signs its site into an OCI artifact, then calls this with the
# artifact ref + a little config. This workflow:
#   preview  — pull + cosign-verify the artifact, upload an un-served Cloudflare version, and
#              CRYPTOGRAPHICALLY VERIFY that version's own stable preview URL (deterministic: the
#              <version>-<worker>.workers.dev URL serves exactly that version, so there is no edge
#              propagation race — no retry needed). A failed verify means no promotion. Runs under
#              the caller's `site-preview` Environment — NOT a reviewer gate (leave it unprotected;
#              it auto-creates on first run), but the pin the broker's Workers-deploy tier requires:
#              workersDeployAuthorized demands an environment claim, fail-closed, so an ungated
#              preview mint needs an environment of its own (infra#336).
#   promote  — gated behind the caller's `site-promote` Environment, and — when the caller sets
#              `keeper_url` — behind a FACE ID CEREMONY (infra#480): the promote job opens a
#              ceremony whose challenge pins THIS run on THIS commit, notifies the approver with
#              the approve URL AND the verified preview URL (review first, then sign), polls for
#              the authorization, and redeems it fail-closed BEFORE the promote credential is
#              minted. A caller that adopts the ceremony can drop its `site-promote` required
#              reviewers (a repo-settings toggle) — the Environment then remains as the broker's
#              pin, which is what the mint actually requires. On approval, deploy the SAME
#              reviewed version to 100% prod, then confirm prod ROUTES to that verified version
#              (manifest equality) + an RFC 9110 probe.
#
# Because the two jobs enter DIFFERENT environments, they cannot share one broker registry entry:
# each job appends its role to `cf_broker_path` and POSTs <path>-preview / <path>-promote, two
# entries per worker pinned to the matching environment. (Contract change from the original single
# path, safe because no caller could ever complete a broker-path run before it — preview had no
# environment, so its mint was unauthorized by construction.)
#
# The heavy cryptographic check runs once, deterministically, in preview; promote only proves prod
# now serves the already-verified bytes. The caller keeps its own (site-specific) build job.
on:
  workflow_call:
    inputs:
      oci:
        description: "Signed OCI artifact ref produced by the caller's build job."
        required: true
        type: string
      domain:
        description: "Production URL, e.g. https://robertdelanghe.dev."
        required: true
        type: string
      identity_regexp:
        description: "cosign --certificate-identity-regexp for this repo, e.g. ^https://github.com/OWNER/REPO/."
        required: true
        type: string
      probe_config:
        description: "Path to the RFC 9110 http-probe config in the caller repo."
        required: false
        type: string
        default: contract/http-probe.json
      cf_broker_url:
        description: >-
          Base URL of the cf-oidc-token-broker. Set this (with cf_broker_path) and the
          Cloudflare token is MINTED PER RUN over GitHub Actions OIDC instead of being
          stored — the caller must then grant `id-token: write`. Leave empty to keep
          using the CLOUDFLARE_API_TOKEN secret.
        required: false
        type: string
        default: ""
      cf_broker_path:
        description: >-
          Broker route PREFIX for the Workers-deploy mints. Each job appends its role:
          preview POSTs <prefix>-preview, promote POSTs <prefix>-promote — so the broker's
          WORKERS_DEPLOY registry needs two entries per worker, one pinned to each
          environment. E.g. /deploy/<worker> → /deploy/<worker>-preview + /deploy/<worker>-promote.
        required: false
        type: string
        default: ""
      cf_broker_audience:
        description: "OIDC audience the broker's WORKERS_DEPLOY entries pin."
        required: false
        type: string
        default: cloudflare-workers-deploy-broker
      keeper_url:
        description: >-
          Base URL of the org's WebAuthn keeper (e.g. https://keeper.bounded.tools). Set it
          and the promote job requires a Face ID ceremony bound to this run and commit
          BEFORE any promote credential is minted (infra#480 — retires the comment/click
          approval for callers that adopt it; the caller must then also grant
          `issues: write` for the notification issue). Leave empty to keep the caller's
          `site-promote` required-reviewer gate as the only human gate.
        required: false
        type: string
        default: ""
      keeper_break_glass:
        description: >-
          Fall back to the retired comment-approval gate because the keeper itself cannot
          serve a ceremony. Loud by design; only honored when keeper_url is set.
        required: false
        type: boolean
        default: false
      break_glass_approvers:
        description: "Comma-separated GitHub logins allowed to approve a break-glass promote by comment."
        required: false
        type: string
        default: bdelanghe
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: >-
          Cloudflare API token scoped to deploy this worker. NOT required when
          cf_broker_url/cf_broker_path are set — that path stores no credential at all,
          which is the point of the broker. Kept for callers that have not migrated.
        required: false

# id-token here is NOT a grant to callers — a called workflow's declared permissions can only
# DOWNGRADE what the caller passes, and a declared block sets every unlisted scope to none. So
# without id-token listed HERE, even a caller granting `id-token: write` had it stripped and the
# broker path could never mint (bdelanghe/site run 31901488737 — the #171 gap). With it listed,
# a caller that grants id-token keeps it, and one that doesn't intersects down to none and gets
# the credential step's clear failure, exactly as before.
permissions:
  contents: read
  packages: read
  id-token: write
  # For the keeper ceremony's notification issue (and the break-glass approval issue).
  # A declared block zeroes every unlisted scope, so without this line even a caller
  # granting issues: write would have it stripped — the same intersection rule the
  # id-token comment above records. Callers not using keeper_url lose nothing: the
  # caller must still grant issues: write for this to be anything but none.
  issues: write

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      ROLE: preview # suffix for the per-role broker route — must match this job's environment
    # A pin, not a gate — see the header. Keep `site-preview` unprotected in the caller repo;
    # required reviewers belong on `site-promote` only.
    environment:
      name: site-preview
      url: ${{ steps.upload.outputs.preview_url }}
    outputs:
      version_id: ${{ steps.upload.outputs.version_id }}
      preview_url: ${{ steps.upload.outputs.preview_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Pull the SIGNED artifact, verify its keyless signature against this repo's identity, unpack
      # exactly those bytes. Verify failure → no upload.
      # role: preview — mints against <cf_broker_path>-preview, pinned to `site-preview`.
      # ── the Cloudflare credential ──────────────────────────────────────────
      # A STORED token is a standing capability: it sits in repo settings, is as
      # long-lived as whoever last rotated it, and is valid whether or not any
      # workflow is running. A broker-minted one is bounded by a single run and
      # is only obtainable by a workflow that can present a GitHub-signed OIDC
      # JWT matching the broker's pins. That difference is the whole reason
      # cf-oidc-token-broker exists, and this workflow predates it.
      #
      # Additive, not a flag day: this is a REUSABLE workflow with callers I
      # cannot enumerate, so the secret still works and the broker is opt-in per
      # caller. `id-token: write` must come from the CALLER — a reusable workflow
      # cannot grant itself more than it is given — so a caller that sets the
      # broker inputs without that permission gets a clear failure rather than a
      # silent fallback to the credential it was trying to stop using.
      - name: Cloudflare credential
        id: cfcred
        env:
          BROKER_URL: ${{ inputs.cf_broker_url }}
          BROKER_PATH: ${{ inputs.cf_broker_path }}
          AUDIENCE: ${{ inputs.cf_broker_audience }}
          STORED: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          if [ -n "${BROKER_URL:-}" ] && [ -n "${BROKER_PATH:-}" ]; then
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
              echo "::error::broker inputs are set but no OIDC token is available."
              echo "::error::Grant 'id-token: write' in the CALLING workflow (the callee already declares it). Falling back to"
              echo "::error::the stored secret here would silently keep the credential you are"
              echo "::error::trying to eliminate, so this fails instead."
              exit 1
            fi
            jwt="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r '.value // empty')"
            [ -n "${jwt:-}" ] || { echo "::error::failed to obtain an OIDC token"; exit 1; }
            # Per-role registry entry — preview and promote enter different environments, so
            # each mints against its own pinned route (see the cf_broker_path input).
            route="${BROKER_PATH}-${ROLE}"
            # NOT `curl -f`: it discards the response body on an HTTP error, and
            # the broker's error body is the whole diagnosis. Observed against the
            # live broker, a mint failure returns cf_errors + token_check, and the
            # pair is what separates "my request was wrong" from "the broker's own
            # credential cannot grant this". `-f` would leave only "502".
            code="$(curl -sS -o /tmp/cfbroker.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${jwt}" "${BROKER_URL%/}${route}" || echo 000)"
            body="$(cat /tmp/cfbroker.json 2>/dev/null || true)"
            tok="$(jq -r '.token // empty' <<<"$body" 2>/dev/null || true)"
            if [ "$code" != "200" ] || [ -z "${tok:-}" ]; then
              echo "::error::broker returned HTTP ${code} for ${route}"
              echo "::error::  response: ${body:0:900}"
              if grep -q '"ok":true' <<<"$body" && grep -q '9109' <<<"$body"; then
                echo "::error::  → token_check ok + cf_error 9109 means the broker's OWN token cannot"
                echo "::error::    DELEGATE this scope. A token only mints permissions it holds, so"
                echo "::error::    grant the parent Workers Scripts: Edit at ACCOUNT scope in infra."
              else
                echo "::error::  → check the job_workflow_ref is on the broker allowlist, the route is"
                echo "::error::    right, and the policy has a Workers Scripts Edit tier."
              fi
              exit 1
            fi
            echo "::notice::minted a per-run Cloudflare token via the broker"
          else
            tok="${STORED:-}"
            if [ -z "$tok" ]; then
              echo "::error::no Cloudflare credential: pass CLOUDFLARE_API_TOKEN, or set"
              echo "::error::cf_broker_url + cf_broker_path to mint one per run."
              exit 1
            fi
            echo "::warning::using the STORED CLOUDFLARE_API_TOKEN. That is a standing"
            echo "::warning::capability with no expiry tied to this run. Migrate to the broker:"
            echo "::warning::set cf_broker_url + cf_broker_path and grant id-token: write."
          fi
          echo "::add-mask::$tok"
          echo "token=$tok" >> "$GITHUB_OUTPUT"

      - name: Pull + verify the signed OCI artifact
        env:
          OCI: ${{ inputs.oci }}
          IDENTITY_REGEXP: ${{ inputs.identity_regexp }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix develop .#deploy --command bash -euo pipefail -c '
            printf "%s" "$GITHUB_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            cosign verify "$OCI" \
              --certificate-identity-regexp "$IDENTITY_REGEXP" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            printf "%s" "$GITHUB_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            rm -rf oci-out dist && mkdir -p oci-out dist
            oras pull "$OCI" -o oci-out
            tar -xzf oci-out/site.tar.gz -C dist
          '

      # Upload a version (preview only — does not change what production serves). Capture the
      # version id (promoted later) + the preview URL (what you review before approving).
      # Run wrangler directly via nix (no inner bash -c), capture output, then parse in the OUTER
      # shell where quoting is sane. NO_COLOR + an ANSI strip make the field extraction robust
      # (wrangler colorizes the version id; the raw log carries escape codes the GH UI hides).
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cfcred.outputs.token }}
          GITHUB_SHA: ${{ github.sha }}
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          short=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          nix develop .#deploy --command wrangler versions upload --tag "sha-$short" --message "preview $short" 2>&1 | tee upload.log
          strip='s/\x1b\[[0-9;]*[mGKH]//g'
          vid=$(grep -F 'Worker Version ID:' upload.log | sed -E "$strip" | tail -1 | awk '{print $NF}')
          url=$(grep -F 'Version Preview URL:' upload.log | sed -E "$strip" | tail -1 | awk '{print $NF}')
          [ -n "$vid" ] || { echo "::error::could not parse Worker Version ID from upload output"; exit 1; }
          [ -n "$url" ] || { echo "::error::could not parse Version Preview URL from upload output"; exit 1; }
          echo "version_id=$vid" >> "$GITHUB_OUTPUT"
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"

      # DETERMINISTIC cryptographic verification — against the version's OWN preview URL, which
      # serves exactly this version immediately and consistently (no prod-route propagation race).
      # This is the heavy check (signature + Fulcio cert + Rekor inclusion + identity + manifest);
      # doing it here, pre-promotion, means we never promote a version that doesn't verify.
      - name: Cryptographically verify the preview version
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
        run: |
          npm ci --prefix vendor/conformance-kit/integrity/verify
          node vendor/conformance-kit/integrity/verify/verify.mjs "$PREVIEW_URL"

      - name: Preview summary
        run: |
          {
            echo "### 🔍 Site preview ready — cryptographically verified, awaiting approval"
            echo ""
            echo "The preview below was signature-verified (sig + Fulcio + Rekor + identity + manifest)."
            echo "**Approve the \`promote\` job** to ship this exact version to ${{ inputs.domain }}."
            echo ""
            echo "- **Preview:** ${{ steps.upload.outputs.preview_url }}"
            echo "- **Version:** \`${{ steps.upload.outputs.version_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # PROMOTE: gated behind the caller's `site-promote` Environment and — when `keeper_url` is set —
  # a Face ID ceremony bound to this run and commit (infra#480). You review the verified preview,
  # then approve — only then does this run, deploying the SAME reviewed, already-verified version
  # to 100% production and confirming prod routes to it. The ceremony runs BEFORE the promote
  # credential is minted, and its notification carries the preview URL so the review-then-sign
  # order survives the gate conversion.
  promote:
    needs: preview
    runs-on: ubuntu-latest
    env:
      ROLE: promote # suffix for the per-role broker route — must match this job's environment
    if: github.ref == 'refs/heads/main' && needs.preview.outputs.version_id != ''
    environment:
      name: site-promote
      url: ${{ inputs.domain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Human authorization BEFORE the mint (infra#480): no promote credential exists until a
      # Face ID has signed THIS run's digest. The challenge pins run_id + head_sha; the
      # notification issue carries the VERIFIED PREVIEW URL so the human reviews what they are
      # about to promote, then signs. `repo` in the request is the CALLER's repo (a reusable
      # workflow runs in the caller's context); `workflow` names this file — the lane that
      # actually holds the gate.
      - name: Open the Face ID ceremony
        id: ceremony
        if: ${{ inputs.keeper_url != '' && !inputs.keeper_break_glass }}
        env:
          KEEPER_URL: ${{ inputs.keeper_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ needs.preview.outputs.preview_url }}
          VERSION_ID: ${{ needs.preview.outputs.version_id }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          set -euo pipefail
          req="$(jq -nc --arg repo "${GITHUB_REPOSITORY#*/}" --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" \
            '{v:"bounded.deploy-request.v1",repo:$repo,workflow:"site-deploy.yml",run_id:$run,head_sha:$sha}')"
          start="$(curl -sfS --max-time 20 -X POST -H 'content-type: application/json' \
            -d "{\"requestType\":\"bounded.deploy-request.v1\",\"request\":$req}" \
            "${KEEPER_URL%/}/authorize/start")" || {
            echo "::error::the keeper refused to open a ceremony. If the keeper itself is down or broken, re-dispatch with keeper_break_glass: true — and say so in the run."
            exit 1
          }
          ceremony="$(jq -r '.ceremonyId // empty' <<<"$start")"
          approve_url="$(jq -r '.approveUrl // empty' <<<"$start")"
          [ -n "$ceremony" ] && [ -n "$approve_url" ] || { echo "::error::keeper returned no ceremony"; exit 1; }
          echo "ceremony=$ceremony" >> "$GITHUB_OUTPUT"
          echo "request=$req" >> "$GITHUB_OUTPUT"
          # The issue is a NOTIFICATION, not a credential: commenting on it does
          # nothing. The approval is the Face ID at the URL.
          issue_url="$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Face ID: approve site promote to ${DOMAIN#https://} (run ${GITHUB_RUN_ID})" \
            --body "$(printf 'A site promote wants to ship the cryptographically verified preview below to %s.\n\nReview the preview, then approve with your passkey (15-minute window):\n\n- Preview: %s\n- Version: %s\n- Approve: %s\n\nThis issue is a notification only — comments here authorize nothing (infra#480 retired the comment/click gate). Run: https://github.com/%s/actions/runs/%s' "$DOMAIN" "$PREVIEW_URL" "$VERSION_ID" "$approve_url" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")")"
          echo "issue_url=$issue_url" >> "$GITHUB_OUTPUT"
          echo "ceremony open — approve at $approve_url"

      - name: Wait for the Face ID, then redeem — fail closed
        if: ${{ inputs.keeper_url != '' && !inputs.keeper_break_glass }}
        env:
          KEEPER_URL: ${{ inputs.keeper_url }}
          CEREMONY: ${{ steps.ceremony.outputs.ceremony }}
          REQ: ${{ steps.ceremony.outputs.request }}
        run: |
          set -euo pipefail
          # Poll until the human approves, the ceremony expires (15 min), or the
          # keeper says GONE. pending/gone being distinct answers is what makes
          # this loop's failure mean "never approved", not "lost a race".
          deadline="$(( $(date +%s) + 900 ))"
          auth=""
          while :; do
            code="$(curl -s --max-time 20 -o /tmp/result.json -w '%{http_code}' "${KEEPER_URL%/}/result?id=${CEREMONY}")" || code=000
            if [ "$code" = "200" ]; then
              if jq -e '.pending' /tmp/result.json >/dev/null 2>&1; then :; else
                auth="$(jq -r '.authorizationId // empty' /tmp/result.json)"
                [ -n "$auth" ] && break
              fi
            elif [ "$code" = "410" ]; then
              echo "::error::the ceremony ended without an authorization: $(jq -r '.error // "gone"' /tmp/result.json 2>/dev/null). Nobody Face ID'd this run."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::no Face ID within the 15-minute window — the promote was not authorized."
              exit 1
            fi
            sleep 10
          done
          redeem="$(curl -sS --max-time 20 -X POST -H 'content-type: application/json' \
            -d "{\"authorizationId\":\"$auth\",\"requestType\":\"bounded.deploy-request.v1\",\"request\":$REQ}" \
            "${KEEPER_URL%/}/redeem")"
          person="$(jq -r '.redeemed.person // empty' <<<"$redeem")"
          if [ -z "$person" ]; then
            echo "::error::redemption refused: $(jq -r '.error // "unknown"' <<<"$redeem"). The grant did not match this run's request — failing closed."
            exit 1
          fi
          cred="$(jq -r '.redeemed.credentialId' <<<"$redeem")"
          be="$(jq -r '.redeemed.backupEligible' <<<"$redeem")"
          {
            echo "## Authorized by Face ID"
            echo "- person: \`$person\`"
            echo "- credential: \`$cred\`"
            echo "- backupEligible: \`$be\` (synced passkey ⇒ aal2 — recorded, not assumed away)"
            echo "- request digest bound to run ${GITHUB_RUN_ID} @ ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✓ authorized by $person (credential $cred)"

      - name: Close the ceremony notification
        if: ${{ steps.ceremony.outputs.issue_url != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_URL: ${{ steps.ceremony.outputs.issue_url }}
        run: gh issue close "$ISSUE_URL" --comment "Authorized by Face ID; ceremony complete." || true

      # BREAK GLASS — the retired comment gate, kept solely for a keeper that
      # cannot serve a ceremony. Loud in the summary. Only honored when the
      # caller opted into the ceremony in the first place.
      - name: Await approval (BREAK GLASS — comment gate, retired for routine use)
        if: ${{ inputs.keeper_url != '' && inputs.keeper_break_glass }}
        uses: bounded-systems/await-approval@3eda4124e16463741037ebe8e546419eaaa4824b # main
        with:
          approvers: ${{ inputs.break_glass_approvers }}
          issue-title: "BREAK GLASS: approve site promote by comment (keeper cannot serve a ceremony)"
          issue-body: >
            A site promote was dispatched with keeper_break_glass: true — the Face ID gate
            was BYPASSED on the stated grounds that the keeper itself cannot serve a
            ceremony. If the keeper is actually healthy, deny this and ask why.

      - name: Record the break-glass in the summary
        if: ${{ inputs.keeper_url != '' && inputs.keeper_break_glass }}
        run: |
          {
            echo "## ⚠ BREAK GLASS promote"
            echo "The Face ID gate was bypassed via keeper_break_glass — authorized by COMMENT, the retired mechanism. Grounds must be that the keeper itself could not serve a ceremony."
          } >> "$GITHUB_STEP_SUMMARY"

      # Re-establish trust at promote time: pull + cosign-verify the signed artifact again, unpack
      # (needed by the prod-routes check below).
      # role: promote — mints against <cf_broker_path>-promote, pinned to `site-promote`.
      # ── the Cloudflare credential ──────────────────────────────────────────
      # A STORED token is a standing capability: it sits in repo settings, is as
      # long-lived as whoever last rotated it, and is valid whether or not any
      # workflow is running. A broker-minted one is bounded by a single run and
      # is only obtainable by a workflow that can present a GitHub-signed OIDC
      # JWT matching the broker's pins. That difference is the whole reason
      # cf-oidc-token-broker exists, and this workflow predates it.
      #
      # Additive, not a flag day: this is a REUSABLE workflow with callers I
      # cannot enumerate, so the secret still works and the broker is opt-in per
      # caller. `id-token: write` must come from the CALLER — a reusable workflow
      # cannot grant itself more than it is given — so a caller that sets the
      # broker inputs without that permission gets a clear failure rather than a
      # silent fallback to the credential it was trying to stop using.
      - name: Cloudflare credential
        id: cfcred
        env:
          BROKER_URL: ${{ inputs.cf_broker_url }}
          BROKER_PATH: ${{ inputs.cf_broker_path }}
          AUDIENCE: ${{ inputs.cf_broker_audience }}
          STORED: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          if [ -n "${BROKER_URL:-}" ] && [ -n "${BROKER_PATH:-}" ]; then
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
              echo "::error::broker inputs are set but no OIDC token is available."
              echo "::error::Grant 'id-token: write' in the CALLING workflow (the callee already declares it). Falling back to"
              echo "::error::the stored secret here would silently keep the credential you are"
              echo "::error::trying to eliminate, so this fails instead."
              exit 1
            fi
            jwt="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r '.value // empty')"
            [ -n "${jwt:-}" ] || { echo "::error::failed to obtain an OIDC token"; exit 1; }
            # Per-role registry entry — preview and promote enter different environments, so
            # each mints against its own pinned route (see the cf_broker_path input).
            route="${BROKER_PATH}-${ROLE}"
            # NOT `curl -f`: it discards the response body on an HTTP error, and
            # the broker's error body is the whole diagnosis. Observed against the
            # live broker, a mint failure returns cf_errors + token_check, and the
            # pair is what separates "my request was wrong" from "the broker's own
            # credential cannot grant this". `-f` would leave only "502".
            code="$(curl -sS -o /tmp/cfbroker.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${jwt}" "${BROKER_URL%/}${route}" || echo 000)"
            body="$(cat /tmp/cfbroker.json 2>/dev/null || true)"
            tok="$(jq -r '.token // empty' <<<"$body" 2>/dev/null || true)"
            if [ "$code" != "200" ] || [ -z "${tok:-}" ]; then
              echo "::error::broker returned HTTP ${code} for ${route}"
              echo "::error::  response: ${body:0:900}"
              if grep -q '"ok":true' <<<"$body" && grep -q '9109' <<<"$body"; then
                echo "::error::  → token_check ok + cf_error 9109 means the broker's OWN token cannot"
                echo "::error::    DELEGATE this scope. A token only mints permissions it holds, so"
                echo "::error::    grant the parent Workers Scripts: Edit at ACCOUNT scope in infra."
              else
                echo "::error::  → check the job_workflow_ref is on the broker allowlist, the route is"
                echo "::error::    right, and the policy has a Workers Scripts Edit tier."
              fi
              exit 1
            fi
            echo "::notice::minted a per-run Cloudflare token via the broker"
          else
            tok="${STORED:-}"
            if [ -z "$tok" ]; then
              echo "::error::no Cloudflare credential: pass CLOUDFLARE_API_TOKEN, or set"
              echo "::error::cf_broker_url + cf_broker_path to mint one per run."
              exit 1
            fi
            echo "::warning::using the STORED CLOUDFLARE_API_TOKEN. That is a standing"
            echo "::warning::capability with no expiry tied to this run. Migrate to the broker:"
            echo "::warning::set cf_broker_url + cf_broker_path and grant id-token: write."
          fi
          echo "::add-mask::$tok"
          echo "token=$tok" >> "$GITHUB_OUTPUT"

      - name: Pull + verify the signed OCI artifact
        env:
          OCI: ${{ inputs.oci }}
          IDENTITY_REGEXP: ${{ inputs.identity_regexp }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix develop .#deploy --command bash -euo pipefail -c '
            printf "%s" "$GITHUB_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            cosign verify "$OCI" \
              --certificate-identity-regexp "$IDENTITY_REGEXP" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            printf "%s" "$GITHUB_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            rm -rf oci-out dist && mkdir -p oci-out dist
            oras pull "$OCI" -o oci-out
            tar -xzf oci-out/site.tar.gz -C dist
          '

      # Promote the exact reviewed version to 100% production. A single version spec with no
      # percentage gets all traffic — avoids @100 vs @100% ambiguity.
      - name: Promote reviewed version to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cfcred.outputs.token }}
          VERSION_ID: ${{ needs.preview.outputs.version_id }}
          NO_COLOR: "1"
        run: nix develop .#deploy --command wrangler versions deploy "$VERSION_ID" --yes

      # Confirm prod ROUTES to the verified version: byte-identical whole-site manifest + provenance
      # served at the prod domain. (The crypto verification already happened in preview; this proves
      # the edge now serves those same bytes.) A short freshness wait covers edge propagation.
      - name: Verify prod serves the verified version
        env:
          DOMAIN: ${{ inputs.domain }}
        run: |
          expected=$(sha256sum dist/site.sha256 | cut -d' ' -f1)
          echo "expected site.sha256=$expected"
          for i in 1 2 3 4 5; do
            live=$(curl -fsS "$DOMAIN/site.sha256" | sha256sum | cut -d' ' -f1) || live="(fetch failed)"
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "$DOMAIN/provenance.json") || code="000"
            if [ "$live" = "$expected" ] && [ "$code" = "200" ]; then
              echo "prod serves the freshly-signed whole-site manifest + provenance.json ✓"
              exit 0
            fi
            echo "edge not fresh yet (attempt $i/5): manifest=$live provenance=$code"
            sleep 10
          done
          echo "::error::prod is not serving the verified version (manifest or provenance.json)"
          exit 1

      # RFC 9110 HTTP-correctness probe of the live edge.
      # Opt-in: a site that ships a probe config gets the RFC 9110 check; one that doesn't is not
      # forced to (a reusable workflow shouldn't mandate a per-site contract file). Add the config
      # at `probe_config` to enable it.
      - name: HTTP correctness probe (RFC 9110)
        env:
          DOMAIN: ${{ inputs.domain }}
          PROBE_CONFIG: ${{ inputs.probe_config }}
        run: |
          if [ ! -f "$PROBE_CONFIG" ]; then
            echo "::notice::no probe config at $PROBE_CONFIG — skipping the RFC 9110 probe for this site"
            exit 0
          fi
          PROBE_CONFIG="$PROBE_CONFIG" node vendor/conformance-kit/integrity/http-probe.mjs "$DOMAIN"
