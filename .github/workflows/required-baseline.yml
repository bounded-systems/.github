# required-baseline — the enforced security FLOOR for every repo. Unlike the opt-in
# repo-standard caller (which a repo chooses to adopt), this is injected on every
# repo's PRs by an org ruleset (the `workflows` rule) — so even un-adopted and
# brand-new repos get OSV + dependency-review with no per-repo wiring.
#
# Must be a normal `on: pull_request` workflow (required workflows can't be reusable).
# Report-only (continue-on-error): the floor guarantees the scan RUNS on every PR and
# surfaces findings; promote to a hard gate later by dropping continue-on-error.
# Actions SHA-pinned (org policy); invocations match prx + repo-standard.
#
# ── Why `osv` and `dependency-review` skip on private repos (#362) ───────────
# Both jobs are no-ops on the org's private repos: OSV-Scanner finds no supported
# lockfile in `.github-private`, and dependency-review needs GitHub Advanced
# Security, which the private repos do not have. Each fire still bills its
# startup minute against the private quota. MEASURED, August 2026,
# `.github-private`: 50 runs × 2 jobs = 100 billable minutes
# (`actions-spend-census.sh`, `.github-private`#868); one run inspected,
# 33701664258 — both jobs green with nothing evaluated. Forward ≈250/month once
# `.github-private`'s PR rate is included — INFERRED from the August rate, not
# measured.
#
# Whether "no private repo can satisfy GHAS" holds is a PLAN question, not a
# settled fact: `.github-private`'s `registry/schema.ts:13` says Team,
# `docs/merge-gate.md:779` says Free, and Code Security is purchasable on Team.
# The skip is correct either way until GHAS is enabled on a private repo — at
# that point REVISIT the `if:` on `dependency-review` (and on `osv`, if a private
# repo grows a supported lockfile). Done-when: a private-repo PR shows both jobs
# as `skipped`, not `success` with nothing evaluated.
#
# The condition is scoped to the two JOBS, not the workflow, on purpose: a
# future `repository_dispatch` step here (`.github-private`#779) must not be
# skipped by it. This is `on: pull_request`, not `workflow_call`, so the
# calling repo is `github.event.repository` straight from the PR event payload,
# where `.private` is a boolean; `!= true` (rather than `== false`) keeps the
# jobs RUNNING if the field is ever absent — the floor fails toward scanning.
name: required-baseline

on:
  pull_request:

permissions:
  contents: read

jobs:
  osv:
    # Private repos: measured no-op, see header (#362). Job-scoped on purpose.
    if: github.event.repository.private != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OSV-Scanner (report-only)
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --format=sarif
            --output=results.sarif
            --recursive
            .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: osv-scanner-results
          path: results.sarif
          retention-days: 5

  dependency-review:
    # Private repos: measured no-op, see header (#362). Job-scoped on purpose.
    if: github.event.repository.private != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Report-only: degrades gracefully on repos without Dependency graph enabled.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
        with:
          fail-on-severity: high
