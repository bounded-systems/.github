name: claim-sweep

# Release this repository's finished and abandoned claims.
#
# THIS IS A CALLER, NOT AN IMPLEMENTATION. The door lives once, in
# `_claim-sweep.yml`, and every consumer calls it — the shape `claim.yml` in
# `.github-private` already has for `_claim.yml`, and for the reason that file
# gives at length: the convention was once "copy this file", and the copies
# drifted in ways that mattered (#226).
#
# WHY THE CROSS-REPO FAN-OUT IS GONE. The first cut of this lane took a `repo`
# input (or `*`) and swept other repositories with a token minted through the
# OIDC broker under a `claim-sweep` entry. That entry does not exist, so every
# cross-repo run would fail at mint, and `.github-private`'s 70 claims sat
# unreachable behind an infra change in a third repository. A reusable needs no
# credential at all: each repository sweeps itself with its own `GITHUB_TOKEN`,
# and adopting the lane is a short caller rather than a broker grant. Org-wide
# coverage is the harness-adoption lane's job, the way every other per-repo
# workflow arrives.
#
# The cron stays weekly and stays a REAL run, per the #713 standing decision
# that the backlog drain must never need a session. Only a dispatch carries the
# dry-run default.

on:
  schedule:
    # Weekly backstop, Monday morning UTC. Offset from pr-sweep's :13 so the two
    # board drains do not contend for the same minute — the org's
    # schedule-spreading habit. A dropped slot costs a week of drift, not
    # correctness: every release this makes is one a later run would also make.
    - cron: "37 9 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (print the release/keep table, touch nothing)"
        type: boolean
        default: true
      release_closed:
        description: "Release claims on closed issues"
        type: boolean
        default: true
      stale_days:
        description: "Release claims on open issues untouched for this many days; 0 releases none"
        type: string
        default: "14"

permissions:
  contents: read

# One sweep at a time: two racing real runs would double-comment and
# double-release. Never cancel a started run — a half-acted sweep with its
# report killed is worse than a queued duplicate.
concurrency:
  group: claim-sweep
  cancel-in-progress: false

jobs:
  sweep:
    # Same-repo, so the reusable is referenced by path at the current ref rather
    # than SHA-pinned: a caller and its callee in one repository move together,
    # and a pin would freeze this lane to whatever the door looked like when the
    # pin was written.
    uses: ./.github/workflows/_claim-sweep.yml
    permissions:
      contents: read
      issues: write
    with:
      # Cron is a real run by the #713 standing decision; a dispatch defaults to
      # dry.
      dry_run: ${{ github.event_name == 'schedule' && false || inputs.dry_run }}
      release_closed: ${{ github.event_name == 'schedule' && true || inputs.release_closed }}
      stale_days: ${{ inputs.stale_days || '14' }}
