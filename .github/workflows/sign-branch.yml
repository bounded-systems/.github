# Re-create a branch's commits as ONE GitHub-signed commit, so a session-authored
# branch can clear the org's required_signatures rule without a human amend.
#
# WHY THIS EXISTS. Every default branch in this org requires verified signatures,
# and a Claude session can satisfy that rule by exactly zero of its lanes —
# measured 2026-08-08 while landing .github#140/.github-private#384, not assumed:
#
#   - local `git commit -S`: the session's configured signing key file is empty,
#     no private half exists anywhere in the container, and registering one is
#     blocked (`PUT /user/ssh_signing_keys` → "sessions are bound to their
#     configured repositories");
#   - GraphQL createCommitOnBranch — the lane org-defaults.yml and
#     registry-graph.yml use for precisely this reason: "This GraphQL query is
#     not enabled for this session — only the pinned set of PR-review operations
#     is served";
#   - REST contents/tree commits: land UNSIGNED (%G? = N), and silently rewrite
#     mode 100755 to 100644 — which on .github-private's check-session-scope.sh
#     would have unmade the hook that settings.json invokes bare.
#
# So every session-authored PR ended in a human running `git commit --amend -S`
# from a laptop: a manual step at the END of the work, after all checks are
# green, on every PR, forever. This workflow is the org's existing answer to
# that shape — "build the window rather than declare the capability missing"
# (merge-claude-harness.yml) — applied to signing: dispatching a workflow is
# something any actor can do, and API commits made HERE are signed by GitHub as
# the token's identity, which satisfies the rule with no key anywhere.
#
# WHAT IT DOES. For the named repo+branch: carry the branch's entire net change
# against its merge-base into one createCommitOnBranch mutation, on a SCRATCH
# ref, and move the branch onto the result only once every check has passed. N
# commits become ONE signed commit — the original messages are preserved in the
# new commit's body, and the replaced tip SHA is named so the history is
# auditable. The tree is verified byte-identical and mode-identical to the old
# tip first; on any mismatch the job fails naming the file, with the branch
# never having moved. Mode verification is not optional politeness: the REST
# probe above showed exactly this corruption, and a hook that lost its exec bit
# is a hook that silently stopped existing.
#
# The scratch ref is not ceremony. Committing in place means resetting the
# branch to base first, and a branch equal to base is a PR with no commits,
# which GitHub closes on its own — it closed infra#268 mid-run on 2026-08-11.
# The branch must never pass through that state.
#
# AUTH. Same-repo runs use the workflow's own GITHUB_TOKEN (createCommitOnBranch
# signs as github-actions[bot]). Cross-repo runs mint the front-desk App via the
# OIDC broker, same door as front-desk-sync (prx-26bq): no App key in this repo,
# and the broker pins job_workflow_ref to refs/heads/main — which is also why
# this file must LAND on main before it can sign anything (its own first landing
# needs one human signature; that is the last one).
#
# WHAT IT REFUSES. The default branch itself, and any branch whose tip is
# already verified — running there could only lose information.
name: sign-branch

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository name (owner fixed to this org), e.g. .github-private"
        type: string
        required: true
      branch:
        description: "Branch whose commits should be re-created signed"
        type: string
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the broker action)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # Its own broker entry, per the doctrine claim-ticket.yml's header states:
      # the fan-in `front-desk` entry must not grow a scope because one window
      # needs it — and the first cross-repo dispatch (run 31233034996) proved it
      # does not carry `contents` at all; the preflight failed at mint naming
      # the gap, exactly as designed.
      #
      # That gap is CLOSED: infra's broker registry now carries `front-desk-sign`
      # with contents:write, pinned to this workflow at refs/heads/main
      # (cloudflare/broker/wrangler.jsonc). Cross-repo runs mint and work —
      # first proven 2026-08-11 signing infra cloudflare/state-drift. Same-repo
      # runs never needed it (they use the workflow's own token).
      - name: Mint cross-repo token via the OIDC broker
        id: app-token
        if: ${{ inputs.repo != github.event.repository.name }}
        uses: ./.github/actions/broker-gh-token
        with:
          app: front-desk-sign
          broker-url: ${{ vars.CF_BROKER_URL }}
          require: contents
      - name: Re-create the branch as one signed commit
        env:
          # Cross-repo: the brokered App token. Same-repo: the workflow's own —
          # both identities produce GitHub-signed commits via the mutation.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          TARGET_REPO: ${{ github.repository_owner }}/${{ inputs.repo }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          default="$(gh api "repos/$TARGET_REPO" --jq .default_branch)"
          if [ "$BRANCH" = "$default" ]; then
            echo "::error title=sign-branch: refusing the default branch::Signing rewrites the ref; the default branch is not a rewrite target."
            exit 1
          fi

          # Read-only clone purely to compute the diff; the ratchet in
          # workflows.test.mjs (no git commit/push in runners) stays satisfied —
          # every write below goes through the API.
          git clone --quiet --no-checkout "https://x-access-token:$GH_TOKEN@github.com/$TARGET_REPO" work
          cd work
          git fetch --quiet origin "$default" "$BRANCH"
          tip="$(git rev-parse "origin/$BRANCH")"
          base="$(git merge-base "origin/$default" "$tip")"
          if [ "$tip" = "$base" ]; then
            echo "::error title=sign-branch: nothing to sign::$BRANCH has no commits beyond $default."
            exit 1
          fi

          verified="$(gh api "repos/$TARGET_REPO/commits/$tip" --jq .commit.verification.verified)"
          if [ "$verified" = "true" ]; then
            echo "sign-branch: tip $tip is already verified — nothing to do."
            exit 0
          fi

          # The mutation takes the branch's NET change: every path that differs
          # between base and tip, additions (base64 of the tip's bytes) and
          # deletions both. Renames arrive as delete+add, which is what a tree
          # diff is; no information is lost that the verification below checks.
          mapfile -t changed < <(git diff --name-only --diff-filter=d "$base" "$tip")
          mapfile -t deleted < <(git diff --name-only --diff-filter=D "$base" "$tip")

          # One commit replaces N: keep every original message in the body, and
          # name the tip being replaced so `git log` explains itself later.
          headline="$(git log -1 --format=%s "$tip")"
          body="$(printf 'Re-created signed from %s by sign-branch (original commit messages follow).\n\n' "$tip"; git log --reverse --format='--- %h ---%n%B' "$base..$tip")"

          # File CONTENT never travels through argv. `--arg c "$base64"` dies with
          # "Argument list too long" on any file whose encoding exceeds
          # MAX_ARG_STRLEN — 128 KiB per SINGLE argument on Linux, which is a much
          # lower ceiling than ARG_MAX and is not raised by having few files. infra's
          # 206 KB cloudflare.summary.json fixture encodes to ~275 KB and killed this
          # step (run 31454511698) immediately after the --argjson fix let it run at
          # all; the three small files on cloudflare/state-drift had gone through
          # moments earlier, which is exactly how a size ceiling hides.
          #
          # So the bytes go through FILES in both directions: --rawfile reads each
          # encoding in, one NDJSON object per changed path, and --slurpfile collects
          # them into the array. This also drops the accumulator that re-serialized
          # the whole array once per file.
          adds="$(mktemp)"
          dels="$(mktemp)"
          for f in "${changed[@]}"; do
            b64="$(mktemp)"
            # -w0 must not wrap, and any trailing newline would corrupt the
            # encoding once --rawfile carries it through verbatim.
            git show "$tip:$f" | base64 -w0 | tr -d '\n' >"$b64"
            jq -n --arg p "$f" --rawfile c "$b64" '{path: $p, contents: $c}' >>"$adds"
            rm -f "$b64"
          done
          for f in "${deleted[@]}"; do
            jq -n --arg p "$f" '{path: $p}' >>"$dels"
          done

          # Build the commit on a SCRATCH ref, then move the branch onto it in one
          # step. The obvious shape — reset the branch to base, commit on top —
          # leaves the branch momentarily EQUAL to base, which is a PR with zero
          # commits, and GitHub closes such a PR by itself. Measured 2026-08-11:
          # signing infra's status/fixture-drift closed infra#268 mid-run
          # (closed_at 03:19:49, head frozen at the base SHA). Its sibling
          # cloudflare/state-drift survived the identical sequence minutes
          # earlier purely because three small files upload faster than 275 KB —
          # the window was shorter, not absent. Racing a remote actor is not a
          # fix, so the branch no longer passes through the empty state at all.
          #
          # The branch is therefore untouched until every check below has passed,
          # which is strictly safer than the restore-on-failure it replaces:
          # there is now no failure mode that leaves the branch needing repair,
          # so the ERR trap and its restore() are gone with the window that made
          # them necessary.
          scratch="sign-branch-tmp/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! gh api -X POST "repos/$TARGET_REPO/git/refs" \
                 -f ref="refs/heads/$scratch" -f sha="$base" >/dev/null 2>&1; then
            # A re-run of the same attempt, or a leftover from a killed job.
            gh api -X PATCH "repos/$TARGET_REPO/git/refs/heads/$scratch" -f sha="$base" -F force=true >/dev/null
          fi
          cleanup() { gh api -X DELETE "repos/$TARGET_REPO/git/refs/heads/$scratch" >/dev/null 2>&1 || true; }
          trap 'cleanup' EXIT

          # `--argjson` is JQ's flag, not gh's — `gh api` rejects it outright
          # ("unknown flag: --argjson"), so this mutation had never once run.
          # It read as working because the only dispatch before 2026-08-11 hit
          # the already-verified early exit above and never reached this line;
          # the first real attempt (infra cloudflare/state-drift) died here.
          # The same shape this repo keeps finding: a lane reporting success
          # without ever exercising the call it exists to make.
          #
          # gh has no way to pass a JSON ARRAY as a variable — -f is a string
          # and -F guesses scalar types — so the request goes as a body gh does
          # not interpret: jq builds {query, variables} and gh posts it on
          # stdin. --slurpfile turns each NDJSON file into its array (an empty
          # file yields [], which is the no-deletions case). A refused mutation
          # fails the step (pipefail) with the target branch never having moved.
          mutation='mutation($repo: String!, $b: String!, $head: GitObjectID!, $h: String!, $body: String!, $add: [FileAddition!]!, $del: [FileDeletion!]!) {
            createCommitOnBranch(input: {
              branch: { repositoryNameWithOwner: $repo, branchName: $b },
              expectedHeadOid: $head,
              message: { headline: $h, body: $body },
              fileChanges: { additions: $add, deletions: $del }
            }) { commit { oid } } }'
          new="$(jq -n \
              --arg query "$mutation" \
              --arg repo "$TARGET_REPO" --arg b "$scratch" --arg head "$base" \
              --arg h "$headline" --arg body "$body" \
              --slurpfile add "$adds" --slurpfile del "$dels" \
              '{query: $query, variables: {repo: $repo, b: $b, head: $head,
                                           h: $h, body: $body,
                                           add: $add, del: $del}}' \
            | gh api graphql --input - --jq .data.createCommitOnBranch.commit.oid)"

          # Verify before touching the branch: byte-identical tree, identical
          # modes, and actually verified. The REST probe that motivated this
          # file corrupted modes silently; "signed but subtly different" must
          # fail here, loudly. Every check below runs against the SCRATCH ref,
          # so a failure leaves $BRANCH exactly where it started.
          git fetch --quiet origin "$scratch"
          if ! git diff --quiet "$tip" "origin/$scratch"; then
            echo "::error title=sign-branch: tree mismatch::The signed commit's tree differs from $tip. $BRANCH untouched."
            exit 1
          fi
          if ! diff <(git ls-tree -r "$tip") <(git ls-tree -r "origin/$scratch") >/dev/null; then
            echo "::error title=sign-branch: mode mismatch::File modes changed (the 100755→100644 failure). $BRANCH untouched."
            exit 1
          fi
          verified="$(gh api "repos/$TARGET_REPO/commits/$new" --jq .commit.verification.verified)"
          if [ "$verified" != "true" ]; then
            echo "::error title=sign-branch: commit not verified::createCommitOnBranch returned an unverified commit ($new) — the token identity has no verification path. $BRANCH untouched."
            exit 1
          fi

          # Everything checked. ONE move, old tip straight to the signed commit,
          # never through base — this is the line the PR's head follows.
          gh api -X PATCH "repos/$TARGET_REPO/git/refs/heads/$BRANCH" -f sha="$new" -F force=true >/dev/null
          echo "sign-branch: $BRANCH is now $new (verified), replacing $tip."
