# repo-standard — the one reusable workflow every repo calls. A repo drops a single
# thin caller (.github/workflows/standard.yml) and opts into behaviors via inputs;
# all the logic lives here, so a change updates every repo at once (derive, not copy).
# See bounded-systems/conformance for the caller template + rollout.
#
# Behaviors (all opt-in):
#   security   (default true)  — OSV-Scanner over git-tracked lockfiles (findings
#                                report-only unless security-gate) + dependency-review (PR gate)
#   security-gate (default false) — promote osv findings from report-only to a hard
#                                fail; tool failures are red in EVERY mode
#   spell      (default false) — cspell dictionary/allowlist gate (needs a cspell.json)
#   quality    (default true)  — prose-proxy gates (claim-discipline + grammar-repetition)
#                                from the pinned conformance-kit, over README + docs (report-only)
#   test       (default false) — set up `runtime` and run `test-command`
#   descriptor (default false) — README managed blocks must match trellis.json
#
# AUTHORITY FLOOR — this workflow is `contents: read` and every job stays within it,
# so a caller only ever needs to grant `contents: read`. GitHub validates a called
# reusable workflow's permission requests as the UNION of all its jobs, at load time,
# before any `if:` — so a single job needing more would force every caller to over-grant
# (that was #55). Jobs that need more authority therefore live in sibling reusable
# workflows, one per ceiling, so a read-only caller is never forced above the floor:
#   scorecard  → repo-scorecard.yml  (adds actions: read)
#   sbom       → repo-release.yml    (adds contents: write)
# Callers opt into those with a dedicated, event-gated job (see #55 / #56).
#
# All actions SHA-pinned (org policy) — and so is `conformance-kit-ref`, which is the
# only non-action code this workflow executes (see the input's description).
name: repo-standard

on:
  workflow_call:
    inputs:
      security:
        description: "Run OSV-Scanner + dependency-review."
        type: boolean
        default: true
      security-gate:
        description: "Fail the osv job on known vulnerabilities. Off, findings are report-only; a scanner that could not run fails in every mode."
        type: boolean
        default: false
      spell:
        description: "Spell-gate: fail on tokens not in the dictionaries or the repo's cspell.json words allowlist (needs a cspell.json in the repo)."
        type: boolean
        default: false
      quality:
        description: "Run the prose-proxy quality gates over README + docs (report-only)."
        type: boolean
        default: true
      conformance-kit-ref:
        description: "conformance-kit COMMIT to pin the quality gates to. A SHA, not a tag: this is the one input that selects code the job actually executes, and a tag can be re-pointed under it."
        type: string
        default: "dc33dd87e8547f9d9543b1f74eef229b4d8abbc9" # v0.9.0
      test:
        description: "Run the test job (set runtime + test-command)."
        type: boolean
        default: false
      descriptor:
        description: "Run the descriptor drift-gate: README managed blocks must match trellis.json."
        type: boolean
        default: false
      runtime:
        description: "Test runtime to set up: bun | deno | node | nix | none."
        type: string
        default: "none"
      test-command:
        description: "Shell command to run for the test job."
        type: string
        default: ""
      deno-version:
        description: "Deno version for runtime: deno (default current 2.x)."
        type: string
        default: "v2.x"

permissions:
  contents: read

jobs:
  osv:
    if: ${{ inputs.security }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # git is the authority on what gets scanned — NOT the scanner's directory
      # walk. osv-scanner's `--recursive` applies .gitignore PATTERNS without
      # git's tracked-file exemption, so a stray `Cargo.lock` line in .gitignore
      # hides a tracked lockfile and the scan reports green having extracted
      # nothing: hooksmith#108 shipped sixteen advisories behind exactly that
      # green for months. Explicit --lockfile args from `git ls-files` make the
      # class unrepresentable — every tracked lockfile is either scanned or
      # fails the run out loud.
      - name: Discover tracked lockfiles
        id: locks
        run: |
          set -euo pipefail
          # Exact basenames osv-scanner can extract. deno.lock is deliberately
          # absent — OSV has no extractor for it; the ci-workflows deps lane
          # covers the npm subset of Deno repos via SBOM conversion. Extending
          # the list is a reviewed diff, and a file matched here that the
          # scanner cannot parse reds the run rather than being skipped.
          names='Cargo.lock|composer.lock|Gemfile.lock|go.mod|mix.lock|package-lock.json|pnpm-lock.yaml|yarn.lock|bun.lock|poetry.lock|pdm.lock|uv.lock|Pipfile.lock|requirements.txt|renv.lock|pubspec.lock|conan.lock|packages.lock.json|gradle.lockfile|buildscript-gradle.lockfile|Package.resolved'
          mapfile -t locks < <(git ls-files | grep -E "(^|/)(${names})\$" || true)
          {
            echo "count=${#locks[@]}"
            echo 'args<<EOF'
            for f in "${locks[@]+"${locks[@]}"}"; do echo "--lockfile=$f"; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [ "${#locks[@]}" -eq 0 ]; then
            # Explicit, because "nothing scannable" and "scanned and clean" must
            # never look alike — the hooksmith#108 tell was silence.
            echo "::notice::osv: no tracked lockfiles — nothing scannable, passing explicitly."
          else
            printf 'osv: %d tracked lockfile(s) to scan:\n' "${#locks[@]}"
            printf '  %s\n' "${locks[@]}"
          fi
      - name: OSV-Scanner
        id: scan
        if: ${{ steps.locks.outputs.count != '0' }}
        # Not report-only here: the triage step below decides pass/fail, so a
        # swallowed FINDING stays possible (by choice) while a swallowed TOOL
        # FAILURE is not.
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --format=sarif
            --output=results.sarif
            ${{ steps.locks.outputs.args }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.locks.outputs.count != '0' }}
        with:
          name: osv-scanner-results
          path: results.sarif
          retention-days: 5
          if-no-files-found: ignore
      - name: Triage scan outcome
        if: ${{ steps.locks.outputs.count != '0' }}
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          GATE: ${{ inputs.security-gate }}
          COUNT: ${{ steps.locks.outputs.count }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" = "success" ]; then
            echo "osv: scanned $COUNT tracked lockfile(s), 0 known vulnerabilities." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The action exposes no exit code, so the SARIF is the discriminator:
          # findings write one, a scanner that could not run does not. The
          # latter must fail in EVERY mode, or an adopting repo shows a
          # reassuring green check while scanning nothing.
          n=0
          if [ -s results.sarif ]; then
            n="$(jq '[.runs[]?.results[]?] | length' results.sarif)"
          fi
          if [ "$n" -eq 0 ]; then
            echo "::error::osv-scanner failed without recording findings — a tool, parse or network failure, not a clean scan. A lane that cannot run must never report green."
            exit 1
          fi
          {
            echo "### osv: $n known vulnerabilities in tracked lockfiles"
            jq -r '.runs[]?.results[]? | "- \(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri // "?")"' results.sarif | sort -u
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$GATE" = "true" ]; then
            echo "::error::osv: $n known vulnerabilities and security-gate is on. Fix them, or commit an osv-scanner.toml [[IgnoredVulns]] entry next to the lockfile with a written reason."
            exit 1
          fi
          echo "::warning::osv: $n known vulnerabilities — report-only. See the run summary and the osv-scanner-results artifact; set security-gate: true in your standard.yml to make this red."

  dependency-review:
    if: ${{ inputs.security && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Report-only baseline: degrades gracefully on repos without Dependency graph
      # enabled (most repos), surfaces high-severity findings where it is. Promote to
      # a hard gate per-repo later (drop continue-on-error once the graph is on).
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
        with:
          fail-on-severity: high

  spell:
    # Opt-in (default false): fails on any token not in the dictionaries or the
    # repo's cspell.json `words` allowlist. Catches nonsense / promotional
    # insertions proactively (a smuggled product name is not a word); adding a
    # term to the allowlist is a reviewed diff — that is the gate. Needs a
    # cspell.json in the repo (start from bounded-systems/conformance's).
    if: ${{ inputs.spell }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: cspell (dictionary allowlist gate)
        run: bunx --bun cspell@8 lint --no-progress "**/*.{md,ts,tsx,js,mjs,cjs,sh,json,yml,yaml}"

  # The org quality bar: the SAME prose-proxy gates on every repo, run from the
  # pinned shared kit over the repo's README + docs. Report-only (WARN) — like the
  # focus-budget cognitive gate, these surface candidates, they don't block. A repo
  # opts out with `quality: false`, or promotes to a hard gate by pinning a ref and
  # running the gates with --strict in its own CI.
  quality:
    if: ${{ inputs.quality }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fetch the shared conformance-kit (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bounded-systems/conformance-kit
          ref: ${{ inputs.conformance-kit-ref }}
          path: .conformance-kit
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: build a prose corpus (README + docs)
        run: |
          node -e '
            const fs = require("fs");
            const md = (s) => s.replace(/```[\s\S]*?```/g, " ").replace(/`[^`]*`/g, " ").replace(/[#>*_\[\]()!|-]/g, " ");
            const files = ["README.md"];
            // Recursive: docs/adr/*.md and docs/handoffs/*.md are docs too, and a repo
            // that nests them must not get a quieter quality bar than a flat-docs one.
            // statSync guards the case existsSync cannot tell apart — `docs` as a FILE,
            // where readdirSync throws and (no continue-on-error) reds the whole job.
            if (fs.existsSync("docs") && fs.statSync("docs").isDirectory())
              for (const f of fs.readdirSync("docs", { recursive: true })) if (f.endsWith(".md")) files.push("docs/" + f);
            const corpus = {};
            // A skipped file is announced. Silence must mean "read everything", never
            // "gave up on something" — same rule the osv job states for scanners.
            for (const f of files) { try { corpus[f] = md(fs.readFileSync(f, "utf8")); } catch (e) { console.log("::warning::corpus: skipped " + f + " (" + e.code + ")"); } }
            fs.writeFileSync("corpus.json", JSON.stringify(corpus));
            console.log("corpus:", Object.keys(corpus).join(", ") || "(none)");
          '
      # No continue-on-error, deliberately. Report-only is enforced INSIDE each gate —
      # both end in `process.exit(strict ? 1 : 0)`, so findings without --strict already
      # exit 0. continue-on-error could therefore never soften a finding; it could only
      # ever hide a BROKEN run (renamed gate script, bad conformance-kit-ref, node crash,
      # changed kit CLI) behind a step annotation. That is the inversion of the rule the
      # osv job states above: a lane that could not run fails in EVERY mode.
      - name: claim discipline (report-only)
        run: node .conformance-kit/gates/claim-discipline-gate.mjs corpus.json
      - name: grammar repetition (report-only)
        run: node .conformance-kit/gates/grammar-repetition-gate.mjs corpus.json

  test:
    if: ${{ inputs.test }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: ${{ inputs.runtime == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - if: ${{ inputs.runtime == 'deno' }}
        uses: denoland/setup-deno@11b63cf76cfcafb4e43f97b6cad24d8e8438f62d # v1
        with:
          deno-version: ${{ inputs.deno-version }}
      - if: ${{ inputs.runtime == 'node' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - if: ${{ inputs.runtime == 'nix' }}
        uses: DeterminateSystems/determinate-nix-action@629b284231c2a82554b724e357e47fc6020833c8 # v3
      - name: test
        run: ${{ inputs.test-command }}

  descriptor:
    if: ${{ inputs.descriptor }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # descriptor pins each claim to its last-touching commit
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # descriptor-kit is cloned until it publishes to JSR, then this becomes
      #   bunx jsr:@bounded-systems/descriptor-kit check .
      - name: descriptor drift-gate (README ⇄ trellis.json)
        run: |
          git clone --depth 1 https://github.com/bounded-systems/descriptor-kit /tmp/descriptor-kit
          (cd /tmp/descriptor-kit && bun install --frozen-lockfile)
          bun /tmp/descriptor-kit/src/cli.ts check .
