name: org-defaults
# Enforce the org-defaults contract: content/strings.json + the community-health
# defaults must conform to org-defaults.mjs (semantics on this repo's static data).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # bootstrap-pin.test.mjs reads the two fetched scripts AT THE RECORDED
          # PIN via `git show`. That pin is usually not the tip, so the default
          # depth-1 checkout cannot resolve it and the test fails on a missing
          # object rather than on drift.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node --test org-defaults.test.mjs
      # First, because it is the check that the other checks ran at all: an
      # unparseable workflow is not reported as a failing check, it just silently
      # stops running its jobs. See the header of workflows.test.mjs.
      - run: node --test workflows.test.mjs
      # The App-manifest creation page generator. Its failure modes are quiet and
      # expensive: a manifest mangled by HTML escaping, or the wrong creation
      # endpoint, both produce a page that WORKS and creates the wrong App — and
      # App ownership cannot be changed, nor a key regenerated, after the fact.
      - run: node --test tools/app-create/render.test.mjs
      # The multi-repo SessionStart dispatcher. Separate step so a failure names
      # itself rather than reading as an org-defaults contract break.
      - run: node --test .claude/session-start-dispatch.test.mjs
      # The service-status probe. Its failure modes are all silence, and
      # silence is also its healthy state — the only thing distinguishing
      # "quiet because healthy" from "quiet because broken" is this suite,
      # which drives the real script over file:// fixtures via its URL seams.
      - run: node --test .claude/status-probe.test.mjs
      - run: node --test .claude/register-mcp.test.mjs
      - run: node --test .claude/gen-bootstrap-pin.test.mjs
      # The relation between the canonical setup-script field and what the
      # dispatcher re-does when that field has not (#91). Red means a step was
      # added to the field with no fallback and no `irreducible:` reason — the
      # state #85 shipped in, which nothing caught until it was read out of
      # /tmp/env-manager.log by hand.
      - run: node --test .claude/bootstrap-steps.test.mjs
      # What keeps the settings write a MERGE (#343). The bug it pins was silent
      # -- a clobber leaves a file that parses perfectly -- so these are mostly
      # preservation tests: each puts something in the document the org did not
      # write and asserts it is still there afterwards.
      - run: node --test .claude/harness-settings.test.mjs
      # The pre-stage ordering as a check (payload-staged.yml). The decision is a
      # pure function so the red message -- which IS the remedy -- is pinned here.
      - run: node --test .claude/payload-staged.test.mjs
      # DERIVED, not restated (#355). This gate fails when a *.test.mjs exists that
      # no workflow runs, or a workflow names one that does not exist. The block
      # below it is the thirteen files that had been in neither list -- passing
      # locally, gating nothing -- when it was written.
      - run: node --test .claude/test-coverage.test.mjs
      - run: node --test .claude/chat-fetch.test.mjs .claude/verb-server.test.mjs .claude/discoverability.test.mjs
      - run: node --test .claude/inject-org-context.test.mjs .claude/inject-org-context-drift.test.mjs .claude/toolpath-pin.test.mjs
      - run: node --test .claude/org-repair-parity.test.mjs
      - run: node --test .claude/claim-sweep-linked-pr.test.mjs .claude/claim-sweep-trigger.test.mjs .claude/pr-claim-contradiction.test.mjs
      - run: node --test pr-claim.test.mjs budget-liveness.test.mjs dependabot-coverage.test.mjs enroll-digest.test.mjs
      # The repo-standard conformance projection (#381): the classifier pinned
      # against real callers, the sweep against a fake GitHub for its two
      # refusals. Under bun, not node — the YAML parser is Bun.YAML — which is
      # why .claude/test-coverage.test.mjs recognises a `bun test` line as a
      # gate too. Its session reader runs under node over fixtures.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun test scripts/repo-standard-conformance.test.mjs
      - run: node --test .claude/repo-standard-conformance.test.mjs
      # boot.sh's FETCH branch, run as a bare host actually meets it (#848).
      # That branch had only ever executed in a managed session, which runs as
      # ROOT — so `mkdir -p /opt/bounded-boot` succeeded there and nowhere else.
      # On the first real floor it failed, every artifact failed to install, and
      # boot.sh still printed `ready` and exited 0. Nothing caught it because
      # nothing ran that branch as anyone but root; this step is the environment
      # the other bootstrap tests do not construct. Needs no privilege — it
      # builds the bare host with `unshare -Urm` — and REFUSES rather than
      # skipping if user namespaces are unavailable, because a cold-start check
      # that quietly skips reports the same green as one that passed.
      - run: bash .claude/boot-cold-start.test.sh
      # Reads GITHUB_EVENT_NAME: FRESHNESS is reported on a pull_request and
      # asserted on push. See the header of bootstrap-pin.test.mjs — PIN cannot
      # name a merge commit that does not exist yet, so no PR touching a fetched
      # file can satisfy it. INTEGRITY stays hard on both.
      - run: node --test .claude/bootstrap-pin.test.mjs
      # The findings buffer and its Stop gate (#162). Listed here for the reason
      # the step below spells out, and the omission was live: the first push of
      # that PR left this line out, so `schema` went green having never executed
      # the suite — including the two negative tests that are the only evidence
      # the gate refuses at all. A gate whose tests do not run in CI is back to
      # being an author's assertion about their own work.
      - run: node --test .claude/stop-hook-findings-check.test.mjs
      # The OTHER Stop hook, which had no suite at all until .github-private#536
      # — three faults that each present as silence, and this job enumerating its
      # files is why the new suite needs a line of its own. Omitting it would
      # repeat, on the very PR that fixes a silent check, the exact failure the
      # paragraph above records.
      - run: node --test .claude/stop-hook-git-check.test.mjs
      # The GitHub App permission reconciliation (#104). Fixture-only, so a
      # docs.github.com or raw.githubusercontent outage cannot turn it red for
      # reasons unrelated to the claim. Named explicitly like every step above:
      # this job enumerates its test files, so a test file that is never listed
      # here runs only on the author's machine and green CI says nothing about
      # it — which is how this one shipped in the first place.
      - run: node --test gh-permission-reconcile.test.mjs
      # The claim-request format and the claim ladder (.github-private#637).
      # Two ratchets that are only ratchets if this line exists — the committed
      # digest fixture, which turns red on any encoding drift, and the cross-file
      # check that this repo's repo-name charset still equals the one
      # claim-ticket.yml's preflight enforces. The paragraph above about a test
      # file that is never listed here is the reason this comment is not shorter.
      - run: node --test claim-digest.test.mjs
      # The claim door's verification leg (.github-private#642) — the consumer
      # side of the format above. Every refusal in that suite is the only
      # evidence the door refuses at all: the relying party is injected, so the
      # negative cases can be exercised without a keeper that can be asked to
      # misbehave. It also carries two cross-file ratchets, one of which asserts
      # THIS line exists, because the paragraph above is about a suite that
      # shipped without one.
      - run: node --test claim-authorization.test.mjs
      # The ceremony half — the thing that fills the door's optional input. Its
      # suite exists for one agreement neither side can check alone at runtime:
      # the request the human is shown must digest to what the door recomputes.
      # If those diverge, every ceremony passes at the keeper and fails at the
      # door, and neither log says why.
      - run: node --test claim-ceremony.test.mjs

  # The other half of that split: main IS the merged state, so main can bump its
  # own pin. Mirrors registry-graph.yml — regenerate, and if that changed
  # anything, open a PR rather than pushing to a protected branch.
  #
  # Terminates because the generator writes only when the pin is WRONG, not when
  # it is merely older — so this run, on the commit the last bump landed as, has
  # nothing to say and opens nothing. That gate is the whole argument; see "Why
  # this terminates" in gen-bootstrap-pin.mjs for the version that looped, and
  # the tests that now hold it.
  pin:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Without this, checkout leaves an http.extraheader Authorization for
          # github.com holding GITHUB_TOKEN, and that header WINS over userinfo
          # in a remote URL — so the `git remote set-url` below would be silently
          # ignored and the push would go out as Actions no matter what token we
          # put in the URL. Off, so the credential we choose is the one used.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node .claude/gen-bootstrap-pin.mjs "${{ github.sha }}"
      # `github.token` CANNOT open this PR, and the fix is not the org setting the
      # error below used to name. Two independent reasons:
      #   1. Actions is not permitted to create PRs in this org — and the toggle
      #      that would allow it (`can_approve_pull_request_reviews`) grants
      #      create AND approve org-wide, which org-baseline.sh A4 deliberately
      #      asserts false.
      #   2. Even with it on, a GITHUB_TOKEN-created PR triggers no workflow runs
      #      (GitHub's recursion guard). `schema` is a REQUIRED check on this repo
      #      (ci-green-dot-github), and a required check that never reports plus
      #      `bypass_actors: []` is a PR that opens and can never merge.
      # An App installation token has neither problem: not governed by that toggle,
      # and PRs it creates do trigger `pull_request`, so `schema` runs.
      # CF_BROKER_URL, not FRONT_DESK_BROKER_URL: one name for one broker
      # (infra#41). Fail-open on it — if it does not resolve, this mints nothing
      # and the step below falls back to github.token, which still pushes the
      # branch correctly and reports why the PR did not open.
      - name: Mint a PR-opening identity via the OIDC broker
        id: app-token
        if: ${{ vars.CF_BROKER_URL != '' }}
        continue-on-error: true
        uses: ./.github/actions/broker-gh-token
        with:
          # `front-desk-pin`, NOT `front-desk` (#87). The fan-in entry carries no
          # `contents`, so it could never push the bump branch — and it cannot be
          # given any: it is deliberately unpinned, and `contents` is privileged,
          # so the broker would refuse the entry outright and every other consumer
          # of it with it. This is its own entry, pinned to this workflow, the
          # same shape `front-desk-schema` and `forge` already have.
          app: front-desk-pin
          broker-url: ${{ vars.CF_BROKER_URL }}
          # BOTH, and in this order of discovery: the hand-rolled check that used
          # to live here asserted `pull_requests` only, and the job then died on
          # the unasserted `contents` at `git push` — exit 128, before any of the
          # annotations below could run (#87). The assertion now lives in the
          # action so the next caller cannot repeat that (#93).
          require: contents, pull_requests
      # The token is used ONLY if the mint step actually succeeded, which includes
      # its `require:` assertion passing. That assertion was previously worth
      # nothing here: `continue-on-error` swallowed it, so a token proven to lack
      # `contents` was used anyway and the push 403'd one step later — the very
      # failure the assertion exists to pre-empt, arriving unchanged (#87).
      #
      # `github.token` DOES hold contents:write here (see this job's permissions),
      # and pushed this branch fine before the broker was wired in (#79). So the
      # fallback is strictly better than proceeding with an insufficient App token:
      # the branch lands with the correct pin either way, and only OPENING the PR
      # is lost. Falling back costs a manual PR; proceeding costs a hand-regenerate.
      - env:
          GH_TOKEN: "${{ steps.app-token.outcome == 'success' && steps.app-token.outputs.token || github.token }}"
          BROKERED: "${{ steps.app-token.outcome == 'success' && steps.app-token.outputs.token != '' }}"
          MINT: "${{ steps.app-token.outcome }}"
        run: |
          [ -z "$(git status --porcelain)" ] && { echo "pin is current"; exit 0; }
          # A FIXED branch, unlike registry-graph's timestamped one: consecutive
          # pushes that each touch a fetched file should update one bump PR to the
          # newest commit, not open a queue of PRs that pin superseded commits.
          b=bootstrap-pin/bump
          # Commit via the API, never `git commit` (#129). A runner-made commit is
          # UNSIGNED, and the ruleset requires verified signatures — so the old
          # `git commit && git push` produced a branch that pushed fine and a PR
          # that could never merge. Every check green, outcome impossible: the
          # required-baseline.yml failure shape (infra#135), one layer up.
          # createCommitOnBranch commits are signed by GitHub as the token's
          # identity — the App here, or github-actions[bot] on the fallback —
          # which satisfies the rule with no signing key in the runner. It also
          # keeps commit and PR under ONE identity, which the recursion guard
          # keys on (same reason the old code pushed with the PR-opening token).
          # Two calls: force the ref to this run's commit, then one API commit
          # carrying the regenerated file on top of it.
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/$b" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/$b" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/$b" -f sha="$GITHUB_SHA" >/dev/null
          fi
          # BOTH files, always. The bump moves boot.sh's bytes, and README's
          # one-line field names that payload by literal digest since #506 — so a
          # commit carrying boot.sh alone lands a field pointing at the PREVIOUS
          # payload, which fails its own gate (`README's canonical field embeds
          # this repo's boot.sh digest, literally`) and would fail closed at boot.
          # That is exactly how #185, the first bump after #506, opened red.
          # The generator writes both; this must commit both, or it re-splits them.
          gh api graphql \
            -f query='mutation($repo: String!, $b: String!, $head: GitObjectID!, $msg: String!, $c: Base64String!, $r: Base64String!) {
              createCommitOnBranch(input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $b },
                expectedHeadOid: $head,
                message: { headline: $msg },
                fileChanges: { additions: [
                  { path: ".claude/boot.sh", contents: $c },
                  { path: ".claude/README.md", contents: $r }
                ] }
              }) { commit { oid } } }' \
            -f repo="$GITHUB_REPOSITORY" -f b="$b" -f head="$GITHUB_SHA" \
            -f msg="chore(bootstrap): pin ${GITHUB_SHA:0:12} and re-record digests" \
            -f c="$(base64 -w0 .claude/boot.sh)" \
            -f r="$(base64 -w0 .claude/README.md)"
          gh pr view "$b" --json state --jq .state 2>/dev/null | grep -q OPEN && { echo "bump PR already open — updated it"; exit 0; }
          # --body-file, never an inline --body. Prose wants blank lines, a `---`
          # rule and a leading `_`, and inside a `run: |` block scalar every one
          # of those has to stay indented: a non-empty line at column 0 ENDS the
          # scalar, and `---` there starts a new YAML document. Written inline,
          # this made the whole workflow unparseable — see workflows.test.mjs.
          # The branch is pushed and correct by this point; only OPENING the PR
          # can still fail, and on 2026-07-31 it did, on the job's first real run:
          #   GraphQL: GitHub Actions is not permitted to create or approve
          #   pull requests (createPullRequest)
          # A bare GraphQL error in a log nobody is watching is how that stayed
          # invisible. Still exits 1 — main really is serving stale files to any
          # session without `.github` attached — but says what to do about it.
          if gh pr create --base main --head "$b" \
               --title "chore(bootstrap): pin ${GITHUB_SHA:0:12} and re-record digests" \
               --body-file .github/bootstrap-pin-bump.md; then
            exit 0
          fi
          if [ "${BROKERED}" = "true" ]; then
            echo "::error title=pin: branch pushed, PR not opened::Pushed $b with the" \
                 "correct pin. The App token minted, so this is NOT the Actions-cannot-" \
                 "create-PRs case: check that the front-desk App is installed on this" \
                 "repo with pull_requests:write. Open a PR from $b by hand meanwhile."
          elif [ "${MINT}" = "failure" ]; then
            # The broker answered and the token was REFUSED by the `require:` check
            # — so this is a scope gap, not a connectivity one, and the two are
            # fixed in different systems. The action's own annotation names which.
            echo "::error title=pin: branch pushed with github.token, PR not opened::Pushed" \
                 "$b with the correct pin. The broker was reachable but the minted token" \
                 "failed its scope assertion, so this fell back to github.token — which can" \
                 "push but cannot create PRs in this org. See the broker-gh-token error above" \
                 "for which scope is missing and where to fix it (#87). Open a PR from $b by" \
                 "hand meanwhile; the branch content is correct and needs no regeneration."
          else
            echo "::error title=pin: branch pushed, PR not opened::Pushed $b with the" \
                 "correct pin, but no App token was minted, so this fell back to" \
                 "github.token — which this org does not permit to create PRs. Fix is" \
                 "the org variable CF_BROKER_URL resolving here (infra#41), NOT the" \
                 "Actions create-and-approve setting: a github.token PR triggers no" \
                 "workflow runs, and \`schema\` is required on this repo, so such a PR" \
                 "would open and then never be mergeable. Open a PR from $b by hand."
          fi
          exit 1
