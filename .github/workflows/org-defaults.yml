name: org-defaults
# Enforce the org-defaults contract: content/strings.json + the community-health
# defaults must conform to org-defaults.mjs (semantics on this repo's static data).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - run: node --test org-defaults.test.mjs
