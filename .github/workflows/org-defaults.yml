name: org-defaults
# Enforce the org-defaults contract: content/strings.json + the community-health
# defaults must conform to org-defaults.mjs (semantics on this repo's static data).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # bootstrap-pin.test.mjs reads the two fetched scripts AT THE RECORDED
          # PIN via `git show`. That pin is usually not the tip, so the default
          # depth-1 checkout cannot resolve it and the test fails on a missing
          # object rather than on drift.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node --test org-defaults.test.mjs
      # First, because it is the check that the other checks ran at all: an
      # unparseable workflow is not reported as a failing check, it just silently
      # stops running its jobs. See the header of workflows.test.mjs.
      - run: node --test workflows.test.mjs
      # The multi-repo SessionStart dispatcher. Separate step so a failure names
      # itself rather than reading as an org-defaults contract break.
      - run: node --test .claude/session-start-dispatch.test.mjs
      - run: node --test .claude/register-mcp.test.mjs
      - run: node --test .claude/gen-bootstrap-pin.test.mjs
      # The relation between the canonical setup-script field and what the
      # dispatcher re-does when that field has not (#91). Red means a step was
      # added to the field with no fallback and no `irreducible:` reason — the
      # state #85 shipped in, which nothing caught until it was read out of
      # /tmp/env-manager.log by hand.
      - run: node --test .claude/bootstrap-steps.test.mjs
      # Reads GITHUB_EVENT_NAME: FRESHNESS is reported on a pull_request and
      # asserted on push. See the header of bootstrap-pin.test.mjs — PIN cannot
      # name a merge commit that does not exist yet, so no PR touching a fetched
      # file can satisfy it. INTEGRITY stays hard on both.
      - run: node --test .claude/bootstrap-pin.test.mjs

  # The other half of that split: main IS the merged state, so main can bump its
  # own pin. Mirrors registry-graph.yml — regenerate, and if that changed
  # anything, open a PR rather than pushing to a protected branch.
  #
  # Terminates because the generator writes only when the pin is WRONG, not when
  # it is merely older — so this run, on the commit the last bump landed as, has
  # nothing to say and opens nothing. That gate is the whole argument; see "Why
  # this terminates" in gen-bootstrap-pin.mjs for the version that looped, and
  # the tests that now hold it.
  pin:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Without this, checkout leaves an http.extraheader Authorization for
          # github.com holding GITHUB_TOKEN, and that header WINS over userinfo
          # in a remote URL — so the `git remote set-url` below would be silently
          # ignored and the push would go out as Actions no matter what token we
          # put in the URL. Off, so the credential we choose is the one used.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node .claude/gen-bootstrap-pin.mjs "${{ github.sha }}"
      # `github.token` CANNOT open this PR, and the fix is not the org setting the
      # error below used to name. Two independent reasons:
      #   1. Actions is not permitted to create PRs in this org — and the toggle
      #      that would allow it (`can_approve_pull_request_reviews`) grants
      #      create AND approve org-wide, which org-baseline.sh A4 deliberately
      #      asserts false.
      #   2. Even with it on, a GITHUB_TOKEN-created PR triggers no workflow runs
      #      (GitHub's recursion guard). `schema` is a REQUIRED check on this repo
      #      (ci-green-dot-github), and a required check that never reports plus
      #      `bypass_actors: []` is a PR that opens and can never merge.
      # An App installation token has neither problem: not governed by that toggle,
      # and PRs it creates do trigger `pull_request`, so `schema` runs.
      # CF_BROKER_URL, not FRONT_DESK_BROKER_URL: one name for one broker
      # (infra#41). Fail-open on it — if it does not resolve, this mints nothing
      # and the step below falls back to github.token, which still pushes the
      # branch correctly and reports why the PR did not open.
      - name: Mint a PR-opening identity via the OIDC broker
        id: app-token
        if: ${{ vars.CF_BROKER_URL != '' }}
        continue-on-error: true
        uses: ./.github/actions/broker-gh-token
        with:
          app: front-desk
          broker-url: ${{ vars.CF_BROKER_URL }}
          # BOTH, and in this order of discovery: the hand-rolled check that used
          # to live here asserted `pull_requests` only, and the job then died on
          # the unasserted `contents` at `git push` — exit 128, before any of the
          # annotations below could run (#87). The assertion now lives in the
          # action so the next caller cannot repeat that (#93).
          require: contents, pull_requests
      - env:
          GH_TOKEN: "${{ steps.app-token.outputs.token || github.token }}"
          BROKERED: "${{ steps.app-token.outputs.token != '' }}"
        run: |
          [ -z "$(git status --porcelain)" ] && { echo "pin is current"; exit 0; }
          # A FIXED branch, unlike registry-graph's timestamped one: consecutive
          # pushes that each touch a fetched file should update one bump PR to the
          # newest commit, not open a queue of PRs that pin superseded commits.
          b=bootstrap-pin/bump
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$b"
          git commit -am "chore(bootstrap): pin ${GITHUB_SHA:0:12} and re-record digests"
          # Push AS the same identity that will open the PR. Attribution is not
          # cosmetic here: a branch pushed by github.token and a PR opened by the
          # App would leave the PR's head commit authored by Actions, and the
          # recursion guard keys on the identity behind the event.
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin "$b"
          gh pr view "$b" --json state --jq .state 2>/dev/null | grep -q OPEN && { echo "bump PR already open — updated it"; exit 0; }
          # --body-file, never an inline --body. Prose wants blank lines, a `---`
          # rule and a leading `_`, and inside a `run: |` block scalar every one
          # of those has to stay indented: a non-empty line at column 0 ENDS the
          # scalar, and `---` there starts a new YAML document. Written inline,
          # this made the whole workflow unparseable — see workflows.test.mjs.
          # The branch is pushed and correct by this point; only OPENING the PR
          # can still fail, and on 2026-07-31 it did, on the job's first real run:
          #   GraphQL: GitHub Actions is not permitted to create or approve
          #   pull requests (createPullRequest)
          # A bare GraphQL error in a log nobody is watching is how that stayed
          # invisible. Still exits 1 — main really is serving stale files to any
          # session without `.github` attached — but says what to do about it.
          if gh pr create --base main --head "$b" \
               --title "chore(bootstrap): pin ${GITHUB_SHA:0:12} and re-record digests" \
               --body-file .github/bootstrap-pin-bump.md; then
            exit 0
          fi
          if [ "${BROKERED}" = "true" ]; then
            echo "::error title=pin: branch pushed, PR not opened::Pushed $b with the" \
                 "correct pin. The App token minted, so this is NOT the Actions-cannot-" \
                 "create-PRs case: check that the front-desk App is installed on this" \
                 "repo with pull_requests:write. Open a PR from $b by hand meanwhile."
          else
            echo "::error title=pin: branch pushed, PR not opened::Pushed $b with the" \
                 "correct pin, but no App token was minted, so this fell back to" \
                 "github.token — which this org does not permit to create PRs. Fix is" \
                 "the org variable CF_BROKER_URL resolving here (infra#41), NOT the" \
                 "Actions create-and-approve setting: a github.token PR triggers no" \
                 "workflow runs, and \`schema\` is required on this repo, so such a PR" \
                 "would open and then never be mergeable. Open a PR from $b by hand."
          fi
          exit 1
