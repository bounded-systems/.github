# The org-wide claim window for tickets. Dispatch this BEFORE starting work on
# an issue; only a completed green run means the claim is yours.
#
# ── Why this exists ──────────────────────────────────────────────────────────
# Two agents doing the same ticket is not hypothetical: hooksmith#108 was
# duplicated outright in the week of 2026-08-03, and infra#184 nearly repeated
# .github#104 an hour before this file was written. Both times the workaround
# was a hand-done "assign + comment" — which works only if the second agent
# happens to look, and nothing made it look. The org's own docs already named
# `claim-ticket.yml` as the ticket-window pattern (session-capability-invariants
# I2, org-sync.yml's header), but no repo in scope actually contained one — a
# named mechanism that does not resolve, which is exactly what
# .github-private/docs/claim-boundary.md P4 forbids. This file is the mechanism.
#
# ── The ticket-window shape ──────────────────────────────────────────────────
# Same move as org-sync.yml, front-desk-add.yml and adopt-claude-harness.yml:
# the workflow holds the credential, so dispatching it is something any actor
# can do, and `issues: write` on every org repo never has to be handed out. One
# central window rather than a per-repo template, because a per-repo copy is
# absent from precisely the repo you are about to duplicate work in — the
# failure above — while this one covers a repo that did not exist yesterday.
#
# ── What a claim IS ──────────────────────────────────────────────────────────
# The claim record on the issue is: the `claimed` label, plus a marker comment
# naming the claimant and this run. The assignee is a best-effort human-facing
# projection of it — agents and bots are usually not assignable, so assignment
# must not be load-bearing. An issue with ANY assignee or the `claimed` label
# counts as already claimed, which also honours claims made by the manual
# workaround this replaces.
#
# Releasing a claim = remove the `claimed` label (and unassign). Nothing expires
# stale claims yet; if that starts to hurt, it is a scheduled sweep in the
# board-parity family, not more logic here.
#
# ── What a claim record SAYS about itself (.github-private#642, #264) ────────
# The record carries a RUNG on the claim ladder, and the reasons it is not
# higher. `human_authorization` is REQUIRED (#264): the rung must reach
# `human-authorized` — a passkey assertion whose CHALLENGE IS THE CLAIM DIGEST,
# verified by the keeper, a relying party that is deliberately not this run
# because an approval the requester renders is self-attestation.
#
# It was optional until #264, and the default was `human-associated`: an account
# is somewhere in the chain. That is still the honest rung for a record naming
# only a dispatcher — github.actor is owner-grade identity and cannot name a
# guest (.github-private#537, #558) — and it is exactly why it no longer passes.
# A door whose ladder tops out at "someone was logged in" was enforcing the
# ladder only against callers who bothered to present something.
#
# NO BREAK-GLASS, deliberately, and not an oversight — see #264. An exemption is
# the path every caller learns to take, so while the keeper cannot serve a
# ceremony, nothing is claimable through a mechanized door. The fallback is the
# one it always was: claim by hand and say plainly that the window was down,
# which buys no exclusion and advertises that it buys none (keycard#7).
#
# See claim-authorization.mjs for what each rung costs.
#
# ── Why it FAILS CLOSED ──────────────────────────────────────────────────────
# The opposite posture from front-desk-add.yml, on claim-boundary.md's
# fail-direction rule: this job's only product is the sentence "the claim is
# yours", and a false green there is what gets believed — it IS the duplicated
# week of work. So no broker, no scope, no recorded claim ⇒ red, and the caller
# falls back to claiming by hand (assign + comment), saying the window was down.
#
# ── Ordering under a race ────────────────────────────────────────────────────
# The concurrency group serializes runs per (repo, issue): of two racing claims
# the second run starts after the first completes, sees its label, and fails
# naming the holder. A run superseded while queued is CANCELLED, and cancelled
# is not green — the fail-closed contract already covers it.
#
# Because a dispatch does not return its run id, callers should verify on the
# ISSUE, not the run list: your claim exists iff the claim comment names your
# claimant (and the `claimed` label is present).
#
# ── The identity ─────────────────────────────────────────────────────────────
# `front-desk-claim` is its own broker entry pinned to this workflow, the shape
# front-desk-pin and front-desk-schema already have (#87): the fan-in
# `front-desk` entry must not grow `issues: write` just because this window
# needs it. Until the broker registry (infra) carries the entry, the mint fails
# at `require:` naming the gap and which of the two places fixes it — that is
# the intended arrival state, not a bug here.
name: claim-ticket

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repository name in bounded-systems (e.g. infra)"
        required: true
        type: string
      issue:
        description: "Issue number to claim"
        required: true
        type: string
      claimant:
        description: "Who is claiming — a session URL, branch name, or handle"
        required: true
        type: string
      human_authorization:
        description: >-
          REQUIRED (#264). An authorization token from the keeper — base64url of
          {authorizationId, nonce, issuedAt}. Get one by running `node claim-ceremony.mjs`
          with CLAIM_REPO/CLAIM_ISSUE/CLAIMANT/KEEPER_URL set and approving with a passkey;
          it prints the token on stdout. ABSENT IS A RED RUN, and so is present-and-
          unverifiable — there is no green path that skips the ceremony. Note the
          keeper sets the window per request type and a claim's may be as short as
          two minutes, so fetch the token immediately before dispatching, not ahead
          of time. See claim-authorization.mjs.
        required: true
        type: string

permissions:
  contents: read # checkout, for the local broker action
  id-token: write # OIDC → cf-token-broker

# THE serializer — see "Ordering under a race" above. Never cancel a run that
# has started: a claim half-recorded then killed is the worst of both worlds.
concurrency:
  group: claim-${{ inputs.repo }}-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      # Inputs land in URL paths below; refuse anything path-shaped rather than
      # escaping it. Broker unset is a red run, not a skip — fail-closed, unlike
      # front-desk-add, for the reason the header gives.
      - name: Preflight — inputs are well-formed and the broker is configured
        env:
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
          BROKER: ${{ vars.CF_BROKER_URL }}
        run: |
          set -euo pipefail
          case "$REPO" in
            (*[!A-Za-z0-9._-]*|"") echo "::error::repo '$REPO' is not a plain repository name"; exit 1 ;;
          esac
          case "$ISSUE" in
            (*[!0-9]*|"") echo "::error::issue '$ISSUE' is not a number"; exit 1 ;;
          esac
          if [ -z "$BROKER" ]; then
            echo "::error::CF_BROKER_URL is unset — the window cannot mint a claim identity." \
              "This run proves nothing about the ticket. Claim by hand instead:" \
              "assign yourself and comment on bounded-systems/$REPO#$ISSUE, and say the window was down."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # ── THE AUTHORIZATION LEG (.github-private#642) ──────────────────────────
      #
      # BEFORE the mint and before any write, because a token that does not verify
      # must stop the run while the ticket is still untouched. A check after the
      # claim was recorded would be a report, not a gate.
      #
      # Since #264 this step decides WHETHER THE CLAIM HAPPENS, not merely which
      # rung the record may name. Two outcomes:
      #
      #   token verifies at human-authorized or higher → green, credential named
      #   anything else, INCLUDING NO TOKEN            → RED, naming the property
      #                                                  that failed
      #
      # The rung a tokenless claim would have recorded — `human-associated` — is
      # still the honest classification, and claim-authorization.mjs still
      # computes it from the ladder rather than hardcoding a refusal. It simply
      # no longer clears the floor. Keeping the classification honest while
      # refusing it is the point: the run tells you what it had, and why that was
      # not enough, instead of collapsing both into a boolean.
      #
      # The floor is applied in ONE place for every path (verifyAbsent and the
      # redemption path share belowFloorReason), so re-adding an exemption for the
      # tokenless case makes claim-authorization.test.mjs go red rather than
      # quietly reopening the door.
      #
      # THE KEEPER URL IS A LITERAL, NOT A VARIABLE (#253). It was `vars.KEEPER_URL`
      # when #252 landed, which made the input inert until someone clicked a setting
      # — and the click could not be delegated to the factory either: the repo-admin
      # door is pinned at `administration: write` in doors.json and an Actions
      # variable needs `variables: write`, so declaring it would have cost a
      # permanent grant widening on the org's most privileged door to manage one
      # public URL string.
      #
      # A literal is the cheaper AND stronger answer here. It is what both site
      # repos already pass to site-deploy.yml, it needs no grant and no click, and
      # it keeps the property the surrounding work exists to enforce: this value can
      # only change through a reviewed diff, on a workflow that is SHA-pinned by its
      # callers besides. A variable buys repointing-without-touching-consumers —
      # genuinely why CF_BROKER_URL is one (see cloudflare/broker/CUSTOM-DOMAIN.md's
      # migration dance) — but two of this URL's three consumers are literals
      # already, so it would buy that for one of three.
      #
      # claim-authorization.mjs still refuses when it reads no keeper URL, and that
      # guard is NOT dead code: claim-ceremony.mjs and the CLI take the value from
      # the environment, where it can genuinely be missing.
      - name: Verify the human authorization, and say which rung it proved
        id: authorization
        env:
          # THE DOOR'S OWN INPUTS. Never the token's — the token contributes only
          # the anti-replay values, and claim-authorization.test.mjs asserts these
          # three lines still read from `inputs`.
          CLAIM_REPO: ${{ inputs.repo }}
          CLAIM_ISSUE: ${{ inputs.issue }}
          CLAIMANT: ${{ inputs.claimant }}
          HUMAN_AUTHORIZATION: ${{ inputs.human_authorization }}
          KEEPER_URL: "https://keeper.bounded.tools"
          DISPATCHER: ${{ github.actor }}
        run: node claim-authorization.mjs

      - name: Mint the claim identity via the OIDC broker
        id: app-token
        uses: ./.github/actions/broker-gh-token
        with:
          app: front-desk-claim
          broker-url: ${{ vars.CF_BROKER_URL }}
          # The only scope this job uses: labels and comments are both issue
          # operations. No contents, no projects — the board reflects claims via
          # its own sweep; this window records them.
          require: issues
      - name: Claim, or fail naming the holder
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
          CLAIMANT: ${{ inputs.claimant }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AUTHORIZATION: ${{ steps.authorization.outputs.authorization }}
          RUNG: ${{ steps.authorization.outputs.rung }}
        run: |
          set -euo pipefail
          api="repos/bounded-systems/$REPO/issues/$ISSUE"
          issue="$(gh api "$api")"

          state="$(jq -r '.state' <<<"$issue")"
          if [ "$state" != "open" ]; then
            echo "::error::bounded-systems/$REPO#$ISSUE is $state — nothing to claim"
            exit 1
          fi

          # ANY assignee or the label counts — see "What a claim IS" above.
          assignees="$(jq -r '[.assignees[].login] | join(", ")' <<<"$issue")"
          labelled="$(jq -r '[.labels[].name] | contains(["claimed"])' <<<"$issue")"
          if [ -n "$assignees" ] || [ "$labelled" = "true" ]; then
            holder="${assignees:-the \`claimed\` label (see the claim comment on the issue)}"
            echo "::error title=claim-ticket: already claimed::bounded-systems/$REPO#$ISSUE" \
              "is held by $holder. Do NOT start work — read the issue and coordinate there."
            echo "❌ **Not claimed** — bounded-systems/$REPO#$ISSUE is held by $holder." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Create the label deliberately rather than leaning on any add-time
          # auto-create behaviour — a claim must not depend on an undocumented
          # side effect.
          if ! gh api "repos/bounded-systems/$REPO/labels/claimed" >/dev/null 2>&1; then
            gh api -X POST "repos/bounded-systems/$REPO/labels" \
              -f name=claimed -f color=1d76db \
              -f description="Held by an agent or human — see the claim comment. Remove to release." \
              >/dev/null
          fi

          gh api -X POST "$api/labels" -f 'labels[]=claimed' >/dev/null

          # Name the dispatcher alongside the claimant: the fallback door
          # (claim-relay, .github-private#532) already records both, and the
          # stronger door must not leave the weaker record. Record parity, not
          # attribution — github.actor is owner-grade identity and cannot name
          # a guest (.github-private#537, #558).
          #
          # $AUTHORIZATION is the rung this run actually proved, PLUS the reasons
          # it is not higher. Both halves, always: a rung with no reasons is a
          # verdict nobody can check, and .github-private/docs/claim-boundary.md
          # P4 is specifically about mechanisms that are named but do not resolve.
          # When a token verified, it also carries the claim-request digest the
          # passkey signed (infra#501) — this comment is workflow-authored, so
          # the approver can compare it against the keeper's approval page
          # without trusting the keeper's own rendering of itself.
          body="$(printf '🎫 **Claimed** by %s — dispatched by `%s` — [run](%s)\n\n%s\n\n<!-- claim-ticket -->\nRelease by removing the `claimed` label (and unassigning) if work stops without a merged PR.' \
            "$CLAIMANT" "$ACTOR" "$RUN_URL" "$AUTHORIZATION")"
          gh api -X POST "$api/comments" -f body="$body" >/dev/null

          # Projection only — most dispatchers are bots and not assignable, and
          # the claim above is already recorded either way.
          gh api -X POST "$api/assignees" -f "assignees[]=$ACTOR" >/dev/null 2>&1 \
            || echo "assignee projection skipped — '$ACTOR' is not assignable on $REPO"

          # The fail-closed backstop: green means the record is READABLE, not
          # that the writes returned 2xx.
          after="$(gh api "$api")"
          if [ "$(jq -r '[.labels[].name] | contains(["claimed"])' <<<"$after")" != "true" ]; then
            echo "::error::the claim did not record on bounded-systems/$REPO#$ISSUE — treat as NOT claimed"
            exit 1
          fi

          echo "✅ **Claimed** bounded-systems/$REPO#$ISSUE for \`$CLAIMANT\` — authorization: \`$RUNG\`." >> "$GITHUB_STEP_SUMMARY"
          echo "claimed: bounded-systems/$REPO#$ISSUE by $CLAIMANT ($RUNG)"
