name: signed-commit
description: >-
  Publish a generated file to a branch as a GitHub-SIGNED commit, VERIFY it was
  actually signed, and optionally open a PR. Actions hands a job a token, not a
  signing key, so `git commit` on a runner produces an unsigned commit that a
  "Commits must have verified signatures" rule will block. This writes via GraphQL
  createCommitOnBranch — the mutation GitHub documents as producing SIGNED commits
  — then reads the signature back rather than trusting it. Use wherever a bot
  writes a generated artifact: schema projections, lockfiles, SBOMs, changelogs.
inputs:
  path:
    description: Repo-relative path to write (e.g. schema/mirror.live.sql).
    required: true
  content-file:
    description: Local file whose bytes to publish. Defaults to `path` in the workspace.
    required: false
    default: ""
  branch:
    description: Branch to create (from `base`) or write onto if it already exists.
    required: true
  base:
    description: Branch/ref to cut `branch` from when it does not exist.
    required: false
    default: ${{ github.ref_name }}
  message:
    description: Commit message.
    required: true
  token:
    description: >-
      Token to authenticate the write. Needs contents:write, plus
      pull-requests:write if `pr-title` is set. NOTE — whether GitHub signs the
      resulting commit is signed should follow from the endpoint, but the
      Contents API taught us it can depend on the IDENTITY — which is why this
      action verifies rather than assumes.
    required: true
  repository:
    description: owner/repo to write to.
    required: false
    default: ${{ github.repository }}
  fail-if-unsigned:
    description: >-
      "true" fails the step when the commit comes back unverified. Default
      "false" warns loudly and continues — correct when the content has already
      been produced by expensive upstream work and a human can still merge with a
      bypass. Set "true" where an unsigned commit is worse than no commit.
    required: false
    default: "false"
  pr-title:
    description: Set to open a PR from `branch` into `base`. Omit to only write the commit.
    required: false
    default: ""
  pr-body-file:
    description: File containing the PR body.
    required: false
    default: ""
  pr-draft:
    description: Open the PR as a draft.
    required: false
    default: "true"
outputs:
  changed:
    description: '"true" when a commit was made; "false" when content already matched.'
    value: ${{ steps.publish.outputs.changed }}
  commit:
    description: SHA of the created commit (empty when nothing changed).
    value: ${{ steps.publish.outputs.commit }}
  verified:
    description: '"true"/"false" — GitHub''s own verdict on the commit signature.'
    value: ${{ steps.publish.outputs.verified }}
  reason:
    description: GitHub's verification reason (e.g. "valid", "unsigned").
    value: ${{ steps.publish.outputs.reason }}
  pr-url:
    description: URL of the PR, when one was opened.
    value: ${{ steps.publish.outputs.pr-url }}
runs:
  using: composite
  steps:
    - id: publish
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repository }}
        TARGET_PATH: ${{ inputs.path }}
        CONTENT_FILE: ${{ inputs.content-file }}
        BRANCH: ${{ inputs.branch }}
        BASE: ${{ inputs.base }}
        MESSAGE: ${{ inputs.message }}
        FAIL_IF_UNSIGNED: ${{ inputs.fail-if-unsigned }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY_FILE: ${{ inputs.pr-body-file }}
        PR_DRAFT: ${{ inputs.pr-draft }}
      run: |
        set -euo pipefail
        src="${CONTENT_FILE:-}"
        [ -n "$src" ] || src="$TARGET_PATH"
        [ -f "$src" ] || { echo "::error::no such file to publish: $src"; exit 1; }

        # Unwritten outputs read as "" downstream, so only real values are emitted.

        # Report truthfully and stop. A caller that must not fail the JOB — e.g.
        # one whose migration has already applied by the time it publishes —
        # sets `continue-on-error: true` on this step. Swallowing failures here
        # instead would put that policy in the wrong place, and is how the
        # ancestor of this action reported a green run that published nothing.
        fail() { echo "::error::$*"; exit 1; }

        want="$(base64 -w0 "$src")"

        # 1. The branch. Created from `base` when absent; written onto when present.
        #    The base sha is resolved SEPARATELY: folding it into the POST's
        #    argument would let a bad `base` fail the create and get reported as
        #    "branch already exists", which is the opposite diagnosis.
        base_sha="$(gh api "repos/$REPO/git/ref/heads/$BASE" --jq .object.sha)" \
          || { echo "::error::cannot resolve base branch '$BASE' in $REPO"; exit 1; }
        #    ONLY "Reference already exists" is benign. Treating every failure as
        #    "already exists" is how front-desk-scheduler run 30379222054 printed
        #    "branch already exists — writing onto it" and then 404'd reading a
        #    branch that had never been created: the real error (a token without
        #    contents:write) was replaced by a reassuring one. A misdiagnosis is
        #    worse than a failure, because it sends the reader somewhere else.
        if create_out="$(gh api -X POST "repos/$REPO/git/refs" \
                           -f ref="refs/heads/$BRANCH" -f sha="$base_sha" 2>&1)"; then
          echo "::notice::created branch $BRANCH from $BASE"
        elif grep -qi 'Reference already exists' <<<"$create_out"; then
          echo "::notice::branch $BRANCH already exists — writing onto it"
        else
          echo "::error::could not create branch $BRANCH: ${create_out//$'\n'/ }"
          echo "::error::usually a token without contents:write. If it is a broker-minted"
          echo "::error::App token, the broker scopes it DOWN to its own permissions map —"
          echo "::error::fix it there, not on the App settings page."
          exit 1
        fi

        # 2. The content currently at that path ON THE BRANCH (not on base — they
        #    diverge as soon as the branch exists). A 404 means a new file.
        have=""
        if meta="$(gh api "repos/$REPO/contents/$TARGET_PATH?ref=$BRANCH" 2>/dev/null)"; then
          # base64 comes back line-wrapped; normalise before comparing.
          have="$(jq -r '.content // empty' <<<"$meta" | tr -d '\n')"
        fi

        # 3. Skip an unchanged write EXPLICITLY rather than relying on the API to
        #    no-op. Whether an identical write creates an empty commit is not
        #    behaviour worth assuming — and an unexplained empty commit on a
        #    branch is exactly the kind of thing nobody investigates.
        if [ -n "$have" ] && [ "$have" = "$want" ]; then
          echo "::notice::$TARGET_PATH on $BRANCH already matches — nothing to commit"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # 4. The write, via GraphQL createCommitOnBranch.
        #
        #    WHY NOT `PUT /repos/{repo}/contents/{path}` (what this used to do).
        #    Both are server-side, but only one PROMISES a signature.
        #    createCommitOnBranch is the mutation GitHub documents as producing
        #    signed commits; the Contents API's behaviour depends on the
        #    authenticating identity, which is how front-desk-scheduler#27 ended
        #    up with an unsigned commit blocked by a signature rule. Choosing the
        #    endpoint with the guarantee is the difference between ensuring a
        #    signature and discovering afterwards whether you got one.
        #
        #    `expectedHeadOid` makes this a compare-and-swap: if anything else
        #    moved the branch between the read above and this write, the mutation
        #    is REJECTED rather than silently clobbering. The Contents API had no
        #    such guard.
        head_oid="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq .object.sha)" \
          || fail "could not read head of $BRANCH"
        [ -n "${head_oid:-}" ] || fail "empty head oid for $BRANCH"

        headline="$(head -1 <<<"$MESSAGE")"
        body="$(tail -n +2 <<<"$MESSAGE" | sed '1{/^$/d}')"

        resp="$(jq -n \
          --arg repo "$REPO" --arg branch "$BRANCH" --arg oid "$head_oid" \
          --arg headline "$headline" --arg body "$body" \
          --arg path "$TARGET_PATH" --arg contents "$want" \
          '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
            variables: {input: {
              branch: {repositoryNameWithOwner: $repo, branchName: $branch},
              expectedHeadOid: $oid,
              message: {headline: $headline, body: $body},
              fileChanges: {additions: [{path: $path, contents: $contents}]}
            }}}' | gh api graphql --input -)" \
          || fail "createCommitOnBranch failed"

        # GraphQL reports errors in a 200 body, so a non-zero exit is NOT the
        # only failure mode — check the payload before trusting it.
        if err="$(jq -r '.errors[0].message // empty' <<<"$resp")" && [ -n "$err" ]; then
          fail "createCommitOnBranch returned an error: $err"
        fi
        commit="$(jq -r '.data.createCommitOnBranch.commit.oid // empty' <<<"$resp")"
        [ -n "$commit" ] || fail "createCommitOnBranch returned no commit oid"
        echo "::notice::wrote $TARGET_PATH as $commit on $BRANCH"
        {
          echo "changed=true"
          echo "commit=$commit"
        } >> "$GITHUB_OUTPUT"

        # 5. VERIFY. The whole reason this action exists is that "written through
        #    the API" does NOT by itself imply "signed" — signing depends on the
        #    authenticating identity. Observed 2026-07-28: a Contents API write
        #    came back with no signature at all while GitHub's own squash-merges
        #    on the same repo were signed. Never assume this; read it back.
        v="$(gh api "repos/$REPO/commits/$commit" --jq '.commit.verification.verified')"
        why="$(gh api "repos/$REPO/commits/$commit" --jq '.commit.verification.reason')"
        {
          echo "verified=$v"
          echo "reason=$why"
        } >> "$GITHUB_OUTPUT"
        if [ "$v" = "true" ]; then
          echo "::notice::$commit is signed and verified ($why)"
        else
          echo "::warning::$commit is NOT verified (reason: ${why:-unknown})."
          echo "::warning::A 'Commits must have verified signatures' rule will block a PR containing it."
          echo "::warning::Signing depends on the identity behind \`token\`, not on the endpoint."
          {
            echo "### ⚠ commit is unsigned"
            echo "\`$commit\` on \`$BRANCH\` came back \`verified: false\` (\`${why:-unknown}\`)."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAIL_IF_UNSIGNED" = "true" ]; then
            echo "::error::fail-if-unsigned is true and the commit is unsigned"
            exit 1
          fi
        fi

        # 6. The PR, opt-in. --head/--base are explicit: gh infers them from the
        #    checked-out branch, and nothing here ever checks `$BRANCH` out.
        if [ -n "$PR_TITLE" ]; then
          pr_args=(pr create --repo "$REPO" --head "$BRANCH" --base "$BASE" --title "$PR_TITLE")
          # Same `set -e` trap as above: pr-draft="false" would abort the step.
          if [ "$PR_DRAFT" = "true" ]; then pr_args+=(--draft); fi
          if [ -n "$PR_BODY_FILE" ] && [ -f "$PR_BODY_FILE" ]; then
            pr_args+=(--body-file "$PR_BODY_FILE")
          else
            pr_args+=(--body "")
          fi
          if url="$(gh "${pr_args[@]}")"; then
            echo "pr-url=$url" >> "$GITHUB_OUTPUT"
            echo "::notice::opened $url"
          else
            # The commit is already on the branch, so a human can still open the
            # PR. Two failures need OPPOSITE fixes and the message says which:
            echo "::warning::could not open the PR — the commit IS pushed to $BRANCH."
            echo "::warning::  'Resource not accessible by integration' → the App installation"
            echo "::warning::     lacks 'Pull requests: write'. The org Actions checkbox will NOT help."
            echo "::warning::  'GitHub Actions is not permitted to create or approve pull requests'"
            echo "::warning::     → the org/repo setting. Prefer fixing the App: that checkbox bundles"
            echo "::warning::     'approve' with 'create' and would let workflows self-approve."
            echo "::warning::Open it here: ${GITHUB_SERVER_URL}/${REPO}/compare/${BRANCH}?expand=1"
          fi
        fi
