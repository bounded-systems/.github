name: broker-gh-token
description: >-
  Get a short-lived GitHub App INSTALLATION token from the cf-token-broker via GitHub
  Actions OIDC — no App private key in the repo (prx-26bq). The calling job must grant
  `permissions: id-token: write`. Replaces per-repo `create-github-app-token` +
  `secrets: inherit`: the App keys live only in the broker.
inputs:
  app:
    description: App name registered in the broker's GH_APPS (e.g. "front-desk").
    required: true
  broker-url:
    description: Broker base URL (e.g. https://cf-token-broker.<...>.workers.dev). Not a secret.
    required: true
  audience:
    description: OIDC audience the broker pins for this app.
    required: false
    default: github-app-broker
  require:
    description: >-
      Comma-separated permission names this job needs at `write` (e.g.
      "contents, pull_requests"). Asserted against what GitHub GRANTED, before
      the token is handed back, so a missing scope fails at mint time naming the
      gap rather than as a bare 403 partway through the work.

      Declare every scope the job will use, not just the first one. On
      2026-08-01 the `pin` job in org-defaults.yml asserted `pull_requests` by
      hand and then died on the unasserted `contents`, at `exit 128` — which
      killed the script before any of its carefully written failure annotations
      could run, and left a job predicting a failure mode ("branch pushed, PR
      not opened") that could not occur, because the branch could not be pushed
      at all. A partial preflight is worse than none: it turns "check your
      scopes" into "scopes were checked".

      Optional, and empty means no assertion — so a caller that only reads, or
      one deliberately best-effort, is unaffected.
    required: false
    default: ""
outputs:
  token:
    description: The installation access token (already masked in logs).
    value: ${{ steps.broker.outputs.token }}
  permissions:
    description: >-
      The permissions GitHub actually GRANTED this token, as a JSON object (or
      "full-grant" for a registry entry with no permissions map). NOT what the
      broker asked for — the two differ, and the difference is invisible until
      the call you wanted to make 403s with "Resource not accessible by
      integration". The broker echoes this precisely so a caller can assert its
      required scope BEFORE doing any work; consume it rather than finding out
      late. Non-secret: these are the App's own configured scopes.
    value: ${{ steps.broker.outputs.permissions }}
runs:
  using: composite
  steps:
    - id: broker
      shell: bash
      env:
        APP: ${{ inputs.app }}
        BROKER_URL: ${{ inputs.broker-url }}
        AUDIENCE: ${{ inputs.audience }}
      run: |
        set -euo pipefail
        # 1. Mint the GitHub Actions OIDC JWT for the broker's audience. These two env vars are
        #    injected ONLY when the job has `permissions: id-token: write`.
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "::error::no OIDC token available — add 'permissions: id-token: write' to the job"
          exit 1
        fi
        jwt="$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | jq -r '.value // empty')"
        if [ -z "$jwt" ]; then echo "::error::failed to obtain an OIDC token"; exit 1; fi
        # 2. Exchange it at the broker for a least-privilege installation token.
        #    Capture the WHOLE response once: it carries the granted permissions
        #    alongside the token, and a second POST would mint a second credential
        #    just to read them.
        #
        #    Status and body are captured SEPARATELY — never `curl -f` here. The broker
        #    puts its diagnosis IN the body ("unknown app: <name>", "unauthorized",
        #    "broker misconfigured"), and -f discards exactly that, collapsing every
        #    refusal into an unexplained `curl: (22)`. That collapse is how a freshly
        #    registered entry whose deploy had not propagated yet (~4 minutes observed)
        #    spent an hour looking like a missing registry entry — infra#192.
        res_file="$(mktemp)"
        code="$(curl -sS -o "$res_file" -w '%{http_code}' -X POST \
          -H "Authorization: Bearer ${jwt}" "${BROKER_URL%/}/github/${APP}")"
        res="$(cat "$res_file")"; rm -f "$res_file"
        if [ "$code" != "200" ]; then
          echo "::error::broker refused to mint for app '${APP}' (HTTP ${code}): ${res}"
          if [ "$code" = "404" ]; then
            echo "::error::404 = the broker DEPLOYMENT serving ${BROKER_URL%/} does not carry '${APP}'." \
                 "Three states look identical from this chair: the registry lacks the entry, the app name" \
                 "is a typo, or the entry is registered and its deploy has not propagated yet (~4 minutes" \
                 "observed once — infra#192). If the registry diff shows '${APP}', retry before concluding" \
                 "it is absent; otherwise the fix is a registry entry in infra plus a broker-deploy."
          fi
          exit 1
        fi
        tok="$(printf '%s' "$res" | jq -r '.token // empty')"
        if [ -z "$tok" ]; then echo "::error::broker returned 200 but no token for app '${APP}' — body was not the mint response"; exit 1; fi
        echo "::add-mask::$tok"
        echo "token=$tok" >> "$GITHUB_OUTPUT"
        # An entry with no permissions map mints FULL-GRANT and the broker returns
        # no `permissions` key. Report that as "full-grant" rather than {} — the
        # two mean opposite things (everything the installation holds vs nothing),
        # and mintInstallationToken deliberately never substitutes one for the other.
        perms="$(printf '%s' "$res" | jq -c 'if has("permissions") then .permissions else "full-grant" end')"
        echo "permissions=$perms" >> "$GITHUB_OUTPUT"
        echo "granted: $perms"
    # Assert the scopes the CALLER declared, before handing the token back.
    #
    # Lives here rather than in each caller because the one caller that did this
    # by hand asserted a single scope and died on the next one (see `require`
    # above). A shared component that exports `permissions` so callers "can
    # assert" leaves each of them to get the list right independently; three
    # callers is three chances to miss one.
    - name: The minted token carries every scope this job declared
      if: ${{ inputs.require != '' }}
      shell: bash
      env:
        APP: ${{ inputs.app }}
        GRANTED: ${{ steps.broker.outputs.permissions }}
        REQUIRE: ${{ inputs.require }}
      run: |
        set -euo pipefail
        # A registry entry with no permissions map mints full-grant: the token
        # carries whatever the installation holds, which is not enumerable here.
        # Nothing to check against, and refusing would break every full-grant
        # caller — so pass, and say why.
        if [ "$GRANTED" = '"full-grant"' ]; then
          echo "full-grant token — carries whatever the installation holds; '$REQUIRE' not independently checkable"
          exit 0
        fi
        missing=""
        for scope in $(printf '%s' "$REQUIRE" | tr ',' ' '); do
          got="$(printf '%s' "$GRANTED" | jq -r --arg s "$scope" '.[$s] // "absent"')"
          if [ "$got" = "write" ]; then
            echo "✓ $scope: write"
          else
            missing="$missing $scope(granted: $got)"
          fi
        done
        [ -z "$missing" ] && exit 0
        # Name BOTH fixable places. The mint succeeding proves the app is
        # registered and the OIDC trust holds; it does not tell you whether the
        # broker failed to REQUEST the scope or the installation does not HOLD
        # it, and the two are fixed in different systems. bounded-systems/.github#87
        # was the second, and was misread as the first for half a day precisely
        # because this message did not exist to say "check both".
        echo "::error title=broker-gh-token: app '$APP' is missing a scope this job needs::" \
             "Required:$missing. Granted: $GRANTED. The mint SUCCEEDED, so the app is" \
             "registered and the OIDC trust is fine — the gap is one of two things, and" \
             "they are fixed in different places: (1) the broker's GH_APPS entry for" \
             "'$APP' does not REQUEST the scope, fixable in the broker registry; or (2)" \
             "the App installation does not HOLD it, fixable in the App's settings on" \
             "GitHub. Check both — do not assume the first."
        exit 1
